# Runs test/check.sh: every check that needs no database (generated files
# current, the lints, the docs lint, the two offline report tests).
# No secrets and no Oracle. The fixture harness stays a local lever
# (test/dbmint_harness.sh), which runs the same script first.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
      - name: Offline checks
        run: test/check.sh
