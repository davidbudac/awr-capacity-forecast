<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AWR capacity report</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --line: #dfe3ea;
  --line-2: #eceff4;
  --ink: #16243b;
  --ink-2: #41506a;
  --ink-3: #6c778a;
  --accent: #2f5fb3;
  --data: #16243b;
  --data-2: #9aa6b8;
  --data-fill: rgba(22, 36, 59, .06);
  --band: rgba(22, 36, 59, .09);
  --crit: #c4262e;
  --crit-wash: #fbe9e9;
  --warn: #b86e00;
  --warn-wash: #fdf3e1;
  --info: #6c778a;
  --ok: #9aa3b2;
  --limit: #c4262e;
  --thresh: #b86e00;
  --esm: #41506a;
  --heat-0: #eef1f5;
  --heat-1: #16243b;
  --tip-bg: #16243b;
  --tip-ink: #f6f7f9;
  --sans: "IBM Plex Sans", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "JetBrains Mono", "Cascadia Mono", "SF Mono", Menlo, Consolas, Hack, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0a0d13;
    --surface: #10141c;
    --surface-2: #171c27;
    --line: #262d3a;
    --line-2: #1c222d;
    --ink: #e4e9f1;
    --ink-2: #a9b3c3;
    --ink-3: #7d889b;
    --accent: #7aa2f7;
    --data: #d5ddea;
    --data-2: #56627a;
    --data-fill: rgba(213, 221, 234, .06);
    --band: rgba(213, 221, 234, .11);
    --crit: #ef6461;
    --crit-wash: #2a1517;
    --warn: #e0a23a;
    --warn-wash: #2a2013;
    --info: #7d889b;
    --ok: #4a5266;
    --limit: #ef6461;
    --thresh: #e0a23a;
    --esm: #a9b3c3;
    --heat-0: #171c27;
    --heat-1: #d5ddea;
    --tip-bg: #e4e9f1;
    --tip-ink: #0a0d13;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0d13;
  --surface: #10141c;
  --surface-2: #171c27;
  --line: #262d3a;
  --line-2: #1c222d;
  --ink: #e4e9f1;
  --ink-2: #a9b3c3;
  --ink-3: #7d889b;
  --accent: #7aa2f7;
  --data: #d5ddea;
  --data-2: #56627a;
  --data-fill: rgba(213, 221, 234, .06);
  --band: rgba(213, 221, 234, .11);
  --crit: #ef6461;
  --crit-wash: #2a1517;
  --warn: #e0a23a;
  --warn-wash: #2a2013;
  --info: #7d889b;
  --ok: #4a5266;
  --limit: #ef6461;
  --thresh: #e0a23a;
  --esm: #a9b3c3;
  --heat-0: #171c27;
  --heat-1: #d5ddea;
  --tip-bg: #e4e9f1;
  --tip-ink: #0a0d13;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 56px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14.5px/1.55 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
b { font-weight: 600; }
.noscript { padding: 24px; }
.stamp, .when { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }

/* the sheet and its masthead */
.page { max-width: 1320px; margin: 0 auto; padding: 36px 48px 64px; background: var(--surface); min-height: 100vh; }
.mast {
  display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 24px;
  border-bottom: 2px solid var(--ink); padding-bottom: 10px; font-size: 13px; color: var(--ink-3);
}
.mast b { color: var(--ink); font: 600 15px var(--mono); margin-right: 8px; }
.gen { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 24px; margin: 8px 0 0; color: var(--ink-3); font-size: 12px; }
.gen b { color: var(--ink-2); font-weight: 500; }
.tools { display: flex; gap: 16px; }
.tbtn {
  border: 0; border-bottom: 1px solid var(--line); background: none; padding: 0 0 1px; font-size: 12px; color: var(--ink-2);
  cursor: pointer; transition: color .15s, border-color .15s;
}
.tbtn:hover { color: var(--ink); border-bottom-color: var(--ink); }
.nav {
  position: sticky; top: 0; z-index: 20; background: var(--surface);
  display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none;
  margin-top: 16px; padding-top: 10px; border-bottom: 1px solid var(--line);
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  white-space: nowrap; padding-bottom: 9px; font-size: 13px; color: var(--ink-2);
  border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
}
.nav a:hover { color: var(--ink); }
.nav a.crit { color: var(--crit); }
.nav a.warn { color: var(--warn); }
.nav a.on { border-bottom-color: currentColor; font-weight: 500; }
.nav a.on:not(.crit):not(.warn) { color: var(--ink); }
.nav .n { color: var(--ink-3); font: 11.5px var(--mono); margin-left: 6px; }

/* status: color only for critical and warning */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ok); }
.dot.crit { background: var(--crit); }
.dot.warn { background: var(--warn); }
.dot.info { background: var(--info); }
.st { font: 12px var(--mono); white-space: nowrap; color: var(--ink-3); }
.st.crit { color: var(--crit); font-weight: 600; }
.st.warn { color: var(--warn); font-weight: 600; }
.tag { font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; }

main { padding-bottom: 24px; }
section { margin-top: 56px; }
#overview { margin-top: 0; }
h1 {
  font: 500 34px/1.18 var(--mono); letter-spacing: -.025em; margin: 32px 0 10px; max-width: 34ch; text-wrap: balance;
  overflow-wrap: anywhere;
}
.lede { font-size: 16px; color: var(--ink-2); max-width: 72ch; margin: 0 0 24px; text-wrap: pretty; }
.sh { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 18px; }
.sh h2 { margin: 0; font: 500 24px/1.2 var(--mono); letter-spacing: -.02em; }
.sh .sum { color: var(--ink-3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.sh .sum b { color: var(--ink-2); font-weight: 500; }
.banner { border-left: 3px solid var(--crit); background: var(--crit-wash); padding: 10px 14px; margin-top: 20px; color: var(--crit); font-size: 14px; }
.banner.warn { border-left-color: var(--warn); background: var(--warn-wash); color: var(--warn); }

/* overview */
.tally { display: flex; flex-wrap: wrap; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.tally > div { flex: 1 1 140px; padding: 12px 16px; border-left: 1px solid var(--line); }
.tally > div:first-child { border-left: 0; padding-left: 0; }
.tally b { display: block; font: 500 30px/1.1 var(--mono); letter-spacing: -.03em; }
.tally span { color: var(--ink-3); font-size: 12.5px; }
.tally .crit b { color: var(--crit); }
.tally .warn b { color: var(--warn); }
.ov h3, .rates h3, .rows h3 { margin: 40px 0 8px; font: 500 16px/1.3 var(--mono); letter-spacing: -.015em; display: flex; gap: 10px; align-items: baseline; }
.ov h3 span { color: var(--ink-3); font: 13px var(--sans); }
.rates .lead { display: block; margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
.lead b { color: var(--ink); font-weight: 600; }
.lead b.crit { color: var(--crit); }
.lead b.warn { color: var(--warn); }
.lead span { color: var(--ink-3); }
.ghead, .grow { display: grid; grid-template-columns: minmax(160px, 2fr) repeat(4, minmax(72px, 1fr)); gap: 16px; align-items: baseline; padding: 8px 0; font-size: 13.5px; }
.ghead { color: var(--ink-3); font-size: 12px; padding: 0 0 7px; border-bottom: 1px solid var(--ink); }
.ghead span, .grow .c { text-align: right; }
.grow .c { font: 12.5px var(--mono); }
.grow { border-bottom: 1px solid var(--line); transition: background-color .15s; }
.grow:hover, .irow:hover, .arow:hover { background: var(--surface-2); }
.grow .s { font: 500 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .s span { font: 12px var(--sans); color: var(--ink-3); margin-left: 4px; }

.idx, .attn { border-top: 1px solid var(--ink); }
.irow {
  display: grid; grid-template-columns: 160px 32px minmax(0, 1fr) 200px 80px; gap: 16px; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; transition: background-color .15s;
}
.irow .dot { display: none; }
.irow .it { font: 500 13px var(--mono); }
.irow.crit .it { color: var(--crit); }
.irow.warn .it { color: var(--warn); }
.irow .ic { color: var(--ink-3); font: 12.5px var(--mono); text-align: right; }
.irow .ih { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.irow .ih b { color: var(--ink); font-weight: 500; }
.irow svg { display: block; width: 100%; height: 24px; }
.irow .iw { text-align: right; }

.arow {
  display: grid; grid-template-columns: 80px 120px minmax(160px, 1.1fr) minmax(200px, 2fr) 104px;
  gap: 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; transition: background-color .15s;
}
.arow .m { color: var(--ink-3); font-size: 12.5px; }
.arow .s { font: 500 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow .s span { font: 12px var(--sans); color: var(--ink-3); margin-left: 4px; }
.arow.crit .s { color: var(--crit); }
.arow.warn .s { color: var(--warn); }
.arow .f { color: var(--ink-2); }
.arow .f b { color: var(--ink); font-weight: 600; }
.arow .d { text-align: right; }
.arow.crit .d .stamp { color: var(--crit); font-weight: 600; }
.allok { padding: 12px 0; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.noisy { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-2); }

.key { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 16px; font-size: 12px; color: var(--ink-3); align-items: center; }
.key span { display: inline-flex; align-items: center; gap: 8px; }
.key i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--data); }
.key i.k-fc { border-top-style: dashed; }
.key i.k-bd { height: 8px; border: 0; border-radius: 1px; background: var(--band); }
.key i.k-lim { border-top: 1px dashed var(--limit); }
.key i.k-thr { border-top: 1px dotted var(--thresh); }
.key i.k-un { width: 8px; height: 8px; border: 1.5px solid var(--crit); border-radius: 50%; }
.key i.k-old { width: 4px; height: 4px; border: 0; border-radius: 50%; background: var(--ink-3); }
.key i.k-es { width: 8px; height: 8px; border: 0; background: var(--esm); transform: rotate(45deg); }

/* metric sections: panels under a heavy rule, no cards */
.secgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); column-gap: 48px; }
.secgrid > section.wide { grid-column: 1 / -1; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 44px 48px; }
.card { position: relative; border-top: 2px solid var(--ink); padding-top: 12px; min-width: 0; }
.card.crit { border-top-color: var(--crit); }
.card.warn { border-top-color: var(--warn); }
.ch { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ch h3 { margin: 0; font: 500 17px/1.3 var(--mono); letter-spacing: -.015em; overflow-wrap: anywhere; }
.ch .ctr { color: var(--ink-3); font-size: 12.5px; }
.ch .st { margin-left: auto; }
.verdict { border-left: 3px solid var(--ink-3); padding: 1px 0 1px 12px; margin: 10px 0 0; font-size: 14px; color: var(--ink); }
.verdict.crit { border-left-color: var(--crit); }
.verdict.warn { border-left-color: var(--warn); }
.verdict b { font-weight: 600; }
.facts {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 14px 0 12px;
}
.fact { padding: 8px 12px 9px; border-left: 1px solid var(--line); min-width: 0; }
.fact:first-child { border-left: 0; padding-left: 0; }
.fact .l { color: var(--ink-3); font-size: 11.5px; }
.fact .v { font: 500 21px/1.3 var(--mono); letter-spacing: -.03em; white-space: nowrap; }
.fact .v small { font: 400 12px var(--sans); letter-spacing: 0; color: var(--ink-3); margin-left: 3px; }
.fact .s { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fact .s .stamp { font-size: 11.5px; color: inherit; }
.fact.crit .v { color: var(--crit); }
.fact.warn .v { color: var(--warn); }
.fact.muted .v { color: var(--ink-3); }
.chart { position: relative; margin-top: 4px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg text { font: 10.5px var(--mono); fill: var(--ink-3); }
.chart svg .lbl, .chart svg .stmp { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; font-weight: 600; }
.card.split { grid-column: 1 / -1; }
.card.split .viz { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.card.split .heat { margin-top: 4px; }
@media (max-width: 1000px) { .card.split .viz { grid-template-columns: minmax(0, 1fr); } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-3); font-size: 12px; margin-top: 4px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--data); vertical-align: middle; margin-right: 8px; }
.legend i.l2 { border-top-color: var(--data-2); }

.trk { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-2); }
.trk .tl { font: 11.5px var(--mono); color: var(--ink-3); margin-right: 8px; }
.trk .cal { color: var(--ink-3); }
.trk.unk { color: var(--ink-3); }
.trk.off { border-left: 3px solid var(--warn); padding-left: 12px; color: var(--ink); }
.tag.rel { color: var(--warn); border-color: var(--warn); }
.issues { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.iss { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); }
.iss b { color: var(--ink); font-weight: 600; font-family: var(--mono); }
.anoms { font-size: 13px; max-width: 720px; }
.anoms .ah { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 11.5px; padding-bottom: 5px; border-bottom: 1px solid var(--ink); }
.an { display: grid; grid-template-columns: 104px minmax(0, 1.2fr) minmax(0, 1.4fr) 64px; gap: 12px; align-items: baseline; padding: 5px 0; color: var(--ink-3); border-bottom: 1px solid var(--line-2); }
.an .dt { color: var(--ink-2); font: 12.5px var(--mono); }
.an .vv { color: var(--ink); font: 500 12.5px var(--mono); white-space: nowrap; }
.an.hi .vv { color: var(--crit); }
.an.lo .vv { color: var(--accent); }
.an .us { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.an .z { text-align: right; font: 12px var(--mono); }

.heat .hh { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 12px; margin-bottom: 8px; }
.heat .ramp { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; }
.heat .ramp i { width: 64px; height: 8px; border-radius: 1px; background: linear-gradient(90deg, var(--heat-0), var(--heat-1)); }
.heat svg { display: block; width: 100%; height: auto; }
.heat svg text { font: 10px var(--mono); fill: var(--ink-3); }

.rows { margin-top: 8px; }
.rows h3 { color: var(--ink-2); font-size: 14px; margin-top: 36px; }
.rows .row:first-of-type { border-top: 1px solid var(--ink); }
.row {
  display: grid; grid-template-columns: minmax(150px, 1.3fr) minmax(120px, 1.6fr) repeat(3, minmax(80px, .8fr)) 88px;
  gap: 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px;
}
.row .nm b { font: 500 13px var(--mono); }
.row .nm span { display: block; color: var(--ink-3); font-size: 12px; }
.row svg { width: 100%; height: 26px; display: block; }
.row .c { text-align: right; font: 12.5px var(--mono); }
.row .c span { display: block; color: var(--ink-3); font: 11.5px var(--sans); }
.row .st { justify-self: end; }
.bar { height: 4px; border-radius: 1px; background: var(--line-2); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--ink-3); }
.bar i.warn { background: var(--warn); }
.bar i.crit { background: var(--crit); }

.tip {
  position: absolute; z-index: 5; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink);
  font: 12px/1.5 var(--mono); padding: 7px 10px; border-radius: 3px; white-space: nowrap;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .14);
  transform: translate(-50%, calc(-100% - 12px)); opacity: 0; transition: opacity .15s;
}
.tip.on { opacity: 1; }
.tip b { font-weight: 600; }
.tip .a { color: #ff9b97; }
:root[data-theme="dark"] .tip .a { color: var(--crit); }

/* tablespace families: one card per family, the members as a table */
.fam.card { grid-column: 1 / -1; }
.fam .fsz { display: flex; flex-wrap: wrap; gap: 4px 28px; margin-top: 8px; font: 12.5px var(--mono); color: var(--ink-2); }
.fam .fsz b { color: var(--ink); font-weight: 600; }
.ftab { width: 100%; border-collapse: collapse; margin-top: 12px; font: 12.5px var(--mono); }
.ftab th { text-align: left; font-weight: 500; color: var(--ink-3); padding: 4px 16px 4px 0; border-bottom: 1px solid var(--line); }
.ftab td { padding: 4px 16px 4px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); }
.ftab .n { text-align: right; }
.ftab tr.filling td { color: var(--ink); font-weight: 600; }
.ftab tr.empty td { color: var(--ink-3); }

/* memory: sizing verdicts are advice, so no alert colours; a change advised takes the accent */
.card.mem {
  grid-column: 1 / -1;
  --mc0: color-mix(in oklab, var(--data) 66%, var(--surface));
  --mc1: color-mix(in oklab, var(--accent) 62%, var(--surface));
  --mc2: color-mix(in oklab, var(--data) 34%, var(--surface));
  --mc3: color-mix(in oklab, var(--accent) 32%, var(--surface));
  --mc4: color-mix(in oklab, var(--data) 16%, var(--surface));
  --mc5: color-mix(in oklab, var(--accent) 15%, var(--surface));
}
.mem .ch .tag { align-self: center; }
.mem .mwin { margin-left: auto; font: 12px var(--mono); color: var(--ink-3); }
.mbody { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 40px; align-items: start; margin-top: 14px; }
@media (max-width: 1000px) { .mbody { grid-template-columns: minmax(0, 1fr); } }
.mrow { padding: 10px 0 11px; border-bottom: 1px solid var(--line); }
.mrow:first-child { border-top: 1px solid var(--line); }
.mh { display: grid; grid-template-columns: 8.5em 11.5em minmax(0, 1fr); gap: 4px 16px; align-items: baseline; }
.mh .ma { font: 500 14px var(--mono); }
.gp { justify-self: start; font: 11.5px var(--mono); white-space: nowrap; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink-3); }
.gp.act { color: var(--accent); font-weight: 600; border-color: color-mix(in oklab, var(--accent) 45%, var(--surface)); background: color-mix(in oklab, var(--accent) 8%, var(--surface)); }
.gp.ie { border-style: dashed; }
.msz { font: 12.5px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.msz .arr { color: var(--ink-3); margin: 0 6px; }
.msz b { color: var(--ink); font-weight: 600; }
.mrow.act .msz b { color: var(--accent); }
.msz .chg { color: var(--ink-3); margin-left: 6px; }
.msz code { font: 12px var(--mono); color: var(--ink-3); margin-left: 10px; }
.mhl { margin: 6px 0 0; font-size: 14px; color: var(--ink); text-wrap: pretty; }
.mrow.ok .mhl, .mrow.ie .mhl { color: var(--ink-2); }
