  function pctTone(p, warn, crit) { return p == null ? '' : p >= crit ? 'crit' : p >= warn ? 'warn' : ''; }

  // Why the fit window is shorter than the history (CAPR_FIT.restart_reason).
  var RESTART = { PURGE: 'since the purge', STOP: 'since growth stopped', START: 'since growth began' };

  function tbspcFacts(m) {
    var f = m.f, out = [];
    var since = f.rst && RESTART[f.rst] ? ' ' + RESTART[f.rst] + (f.rstDay ? ', ' + fDay(dayN(f.rstDay)) : '') : '';
    out.push({ k: 'pct', l: 'Used', v: num(f.pct, 1) + '<small>%</small>', s: m.unit.fmt(f.v) + ' of ' + m.unit.fmt(f.lim),
      tone: pctTone(f.pct, K.nfWarn, K.nfCrit) });
    if (f.q === 'CYCLIC') {
      out.push({ l: 'Cycle peak', v: num(f.cycPk, 1) + '<small>%</small>', s: (f.cycN || 0) + ' purges, every ' + Math.round(f.cycD || 0) + ' d' });
      out.push({ l: 'Peak growth', v: m.unit.rate(f.pkSlope) });
    } else {
      out.push({ l: 'Growth', v: m.unit.rate(f.slope), s: f.accel != null && f.accel >= 1.5 ? 'accelerating \u00d7' + num(f.accel, 1) : 'fit over ' + (f.n || '\u2013') + ' d' + since });
    }
    out.push(dtfFact(f, 'Full in'));
    // The disk the tablespaces share stops it before its own limit (CAPR_TBSPC_SHARED).
    var sh = SHARED[key(f.dbid, f.con, f.s)];
    if (sh && sh.by === 'DISK' && sh.dtfSh != null)
      out.push({ l: 'On the shared disk', v: fDays(sh.dtfSh), s: 'stuck at ' + num(sh.limSh, 1) + ' GiB' + (sh.disk ? ', disk ' + esc(sh.disk) : '') });
    if (f.need90 > 0) out.push({ l: 'Add for 90 d', v: num(f.need90, 1) + '<small>GiB</small>', s: f.addBy ? 'by ' + fDay(dayN(f.addBy)) : '' });
    if (f.below) out.push({ l: 'Limit', v: 'below used', tone: 'crit' });
    return out;
  }

  function limitFacts(label, limWord) {
    return function (m) {
      var f = m.f, out = [];
      out.push({ l: label, v: m.unit.fmt(f.v), s: f.lim != null ? 'of ' + m.unit.fmt(f.lim) + ' ' + limWord : 'no limit' });
      if (f.pct != null) out.push({ k: 'pct', l: 'Of ' + limWord, v: num(f.pct, 1) + '<small>%</small>', tone: pctTone(f.pct, SERIES_SAT, 100) });
      out.push({ l: m.unit.rateLabel, v: m.unit.rate(f.slope), s: 'fit over ' + (f.n || '\u2013') + ' d' });
      if (f.lim != null) out.push(dtfFact(f, SERIES_SAT + '% in'));
      return out;
    };
  }

  /* A flow has no limit (redo per day, the I/O rates): the latest day, the
     week's average and the trend. fam.flow words the latest day. */
  function flowFacts(label) {
    return function (m) {
      var f = m.f;
      var avg = avgLast(m.pts, 7);
      return [
        { l: label, v: m.unit.fmt(lastVal(m.pts)) },
        { l: '7-day average', v: m.unit.fmt(avg) },
        { l: m.unit.rateLabel, v: m.unit.rate(f.slope), s: 'fit over ' + (f.n || '\u2013') + ' d' }
      ];
    };
  }

  function cpuFacts(m, p95, avg) {
    var f = m.f, out = [];
    out.push({ k: 'now', l: 'Busy-hour p95', v: num(f.v, 1) + '<small>%</small>', s: f.hot ? 'at the ' + CPU_SAT + '% line now' : 'of ' + p95,
      tone: pctTone(f.v, CPU_SAT * 0.9, CPU_SAT) });
    var a = m.fits[avg];
    out.push({ l: 'Daily average', v: a ? num(a.v, 1) + '<small>%</small>' : '\u2013' });
    out.push({ l: m.unit.rateLabel, v: m.unit.rate(f.slope), s: f.sig === 0 ? 'not significant' : 'fit over ' + (f.n || '\u2013') + ' d' });
    out.push(dtfFact(f, CPU_SAT + '% in'));
    return out;
  }
  function hostCpuFacts(m) {
    var out = cpuFacts(m, 'host CPU', 'BUSY_PCT');
    var pk = m.fits.BUSY_PEAK;
    if (pk) out.splice(2, 0, { l: 'Peak window', v: num(pk.v, 1) + '<small>%</small>', s: 'business hours' });
    return out;
  }
  function dbCpuFacts(m) { return cpuFacts(m, 'host CPUs', 'DB_CPU_PCT'); }

  function lastVal(pts) { for (var i = pts.length - 1; i >= 0; i--) if (pts[i].y != null) return pts[i].y; return null; }
  function avgLast(pts, n) {
    var s = 0, c = 0;
    pts.forEach(function (p) { if (p.y != null && p.x > LAST - n) { s += p.y; c++; } });
    return c ? s / c : null;
  }

  /* ---------- alert and anomaly wording (facts only) ---------- */

  function alertWhen(a) {
    if (a.unit === 'DAYS' || a.u === 'DAYS') return stamp(LAST + a.v);
    if (/_ANOM$/.test(a.kind)) return '<span class="when">' + fDay(dayN(a.n > 1 ? a.first : a.day)) + (a.n > 1 ? '\u2013' + fDay(dayN(a.day)) : '') + '</span>';
    return '<span class="when">now</span>';
  }

  /* An anomaly alert's value is in the unit the series is scored in. The
     alert row has one name for some of them (GIB is GiB and GiB a day), so
     the unit comes from the series' own anomaly rows when the metric is
     known, else from the alert. */
  var ALERT_UNIT = { BYTES: 'bytes_per_day', GIB: 'gib_per_day' };
  function anomUnit(a, m) {
    var rows = m ? m.anoms.filter(function (x) { return x.s === a.s && x.ak !== 'CPU_SHIFT' && x.u; }) : [];
    return rows.length ? rows[0].u : ALERT_UNIT[a.u] || (a.u || '').toLowerCase();
  }
  var ANOM_SUFFIX = { gib_per_day: ' GiB/d', gib: ' GiB', io_per_sec: ' IO/s', mb_per_sec: ' MB/s' };
  function anomFmt(u) {
    if (u === 'bytes_per_day') return function (v) { return fBytes(v) + '/d'; };
    if (u === 'pct') return function (v) { return num(v, 1) + '%'; };
    return function (v) { return auto(v) + (ANOM_SUFFIX[u] || ''); };
  }

  function alertFact(a, m) {
    var u = m ? m.unit : unitFor(a.u);
    switch (a.kind) {
      case 'TBSPC_FULL': return 'full in <b>' + fDays(a.v) + '</b>';
      case 'DISK_FULL': return 'shared disk full in <b>' + fDays(a.v) + '</b>';
      case 'CPU_SAT': case 'DBCPU_SAT': return CPU_SAT + '% busy in <b>' + fDays(a.v) + '</b>';
      case 'SERIES_LIMIT': return SERIES_SAT + '% of limit in <b>' + fDays(a.v) + '</b>';
      case 'TBSPC_NEARFULL': return '<b>' + num(a.v, 1) + '%</b> used';
      case 'SERIES_NEARLIMIT': return '<b>' + num(a.v, 1) + '%</b> of limit';
      case 'CPU_HOT': case 'DBCPU_HOT': return 'busy-hour p95 <b>' + num(a.v, 1) + '%</b> now';
      case 'CPU_SHIFT': return 'level shift <b>' + sign(a.v) + num(Math.abs(a.v), 1) + '%</b>';
      case 'DATA_STALE': return 'no AWR snapshot for <b>' + auto(a.v) + ' h</b>';
      case 'MODEL_HEALTH': return 'ESM model ' + esc(a.msg || '');
      case 'TBSPC_FAMILY': return 'filling member may reach <b>' + num(a.v, 2) + ' GiB</b>, ceiling ' + num(a.thr, 2) + ' GiB';
    }
    if (/_ANOM$/.test(a.kind)) {
      var af = anomFmt(anomUnit(a, m));
      var span = a.n > 1 ? ' \u00b7 ' + a.n + ' days' : '';
      return 'unusual <b>' + af(a.v) + '</b>, normal \u2264 ' + af(a.thr) + (a.maxz != null ? ' \u00b7 z ' + num(a.maxz, 1) : '') + span;
    }
    return esc(a.msg || a.kind);
  }

  /* One chip per flagged day: the day verdict (worst mode) plus its flagged hours. */
  function anomalyEvents(m) {
    var days = {};
    m.anoms.forEach(function (a) {
      if (a.ak === 'CPU_SHIFT') return;
      var d = dayN(a.ts);
      if (d <= LAST - ANOM_DAYS) return;
      var e = days[d] || (days[d] = { d: d, day: null, hours: {}, nh: 0, f: a.f, z: 0 });
      if (a.grain === 'HOUR') {
        if (!e.hours[a.ts]) e.nh++;
        e.hours[a.ts] = a.f;
      } else if (!e.day || Math.abs(a.z) > Math.abs(e.day.z)) e.day = a;
      if (Math.abs(a.z || 0) >= Math.abs(e.z)) { e.z = a.z; e.f = a.f; }
    });
    return Object.keys(days).map(function (k) { return days[k]; })
      .sort(function (a, b) { return b.d - a.d; });
  }

  function anomalyChip(ev, m) {
    var val = '', usual = '', a = ev.day;
    if (a) {
      if (m.fam.id === 'tablespaces' || m.f.s === 'DB_SIZE_GB') {
        var scale = m.fam.id === 'tablespaces' ? 1 : Math.pow(1024, 3);
        val = sign(a.v) + fBytes(Math.abs(a.v * scale)) + ' in a day';
        usual = 'usual ' + fBytes(a.e * scale);
      } else {
        val = m.unit.fmt(a.v);
        usual = 'usual ' + m.unit.fmt(a.e);
      }
    }
    if (ev.nh) {
      var hrs = ev.nh + ' h ' + (ev.f === 'LOW' ? 'below' : 'above') + ' their usual hour';
      if (val) usual += ' \u00b7 ' + hrs; else val = hrs;
    }
    return '<div class="an ' + (ev.f === 'LOW' ? 'lo' : 'hi') + '"><span class="dt">' + fWDay(ev.d) + '</span><span class="vv">' + val +
      '</span><span class="us">' + usual + '</span><span class="z">z ' + num(ev.z, 1) + '</span></div>';
  }

  /* ---------- charts ---------- */

  var CHARTS = [];
  var W = 640, H = 196, ML = 44, MR = 14, MT = 22, MB = 24;

  function niceTicks(lo, hi, n) {
    var span = hi - lo || 1, step = Math.pow(10, Math.floor(Math.log10(span / n)));
    var err = span / n / step;
    step *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
    var t = [], v = Math.ceil(lo / step) * step;
    for (; v <= hi + step * 1e-9; v += step) t.push(+v.toFixed(10));
    var dp = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
    return { ticks: t, step: step, dp: dp };
  }

  function forecastKnots(m, method) {
    return m.fc.filter(function (r) { return r.m === method; })
      .map(function (r) { return { x: dayN(r.t), y: r.v, lo: r.lo, hi: r.hi }; })
      .sort(function (a, b) { return a.x - b.x; });
  }

  function horizon(m) {
    var f = m.f, h = 90;
    var reach = m.fc.reduce(function (r, k) { return k.m === 'REGR' ? Math.max(r, k.h) : r; }, 30);
    if (f.dtf != null && f.dtf > 60 && f.dtf <= 330) h = Math.ceil((f.dtf + 20) / 30) * 30;
    return Math.min(h, reach);
  }

  function isHot(m) {
    var f = m.f;
    if (f.dtf != null && f.q === 'OK' && f.dtf <= K.dtfWarn) return true;
    if (f.k === 'TBSPC') return f.pct >= K.nfWarn;
    if (f.k === 'SERIES') return f.pct >= SERIES_SAT;
    return !!f.hot;
  }

  function limitLines(m) {
    var f = m.f, out = [];
    if (m.f.k === 'CPU') out.push({ y: CPU_SAT, cls: 'thr', label: CPU_SAT + '%', target: true });
    else if (f.lim != null) {
      out.push({ y: f.lim, cls: 'lim', label: 'limit ' + m.unit.fmt(f.lim), target: m.f.k === 'TBSPC' });
      if (m.f.k === 'SERIES') out.push({ y: f.lim * SERIES_SAT / 100, cls: 'thr', label: SERIES_SAT + '%', target: true });
      else if (K.nfWarn) out.push({ y: f.lim * K.nfWarn / 100, cls: 'thr', label: K.nfWarn + '%' });
    }
    return out;
  }

  function chartSpec(m) {
    var lines = (m.fam.lines || [[m.f.s, '']]).map(function (l, i) {
      return { s: l[0], label: l[1], pts: PTS[key(m.f.k, m.f.dbid, m.f.con, l[0])] || [], role: i };
    }).filter(function (l) { return l.pts.length; });
    return {
      hot: isHot(m),
      lines: lines, fc: forecastKnots(m, 'REGR'), esm: forecastKnots(m, 'ESM'),
      limits: limitLines(m), unit: m.unit, x0: FIRST != null ? FIRST : (lines[0] && lines[0].pts[0] ? lines[0].pts[0].x : LAST - 90),
      x1: LAST + horizon(m), pctAxis: m.f.k === 'CPU', m: m
    };
  }

  function chartSvg(spec, id) {
    var xs = function (x) { return ML + (x - spec.x0) / (spec.x1 - spec.x0) * (W - ML - MR); };
    var ymax = 0, ymin = 0;
    spec.lines.forEach(function (l) { l.pts.forEach(function (p) { if (p.y != null) { ymax = Math.max(ymax, p.y); ymin = Math.min(ymin, p.y); } }); });
    spec.limits.forEach(function (l) { ymax = Math.max(ymax, l.y); });
    spec.fc.forEach(function (k) { if (k.x <= spec.x1) ymax = Math.max(ymax, k.hi != null ? k.hi : k.y); });
    if (spec.pctAxis) ymax = Math.max(ymax, CPU_SAT);
    var sc = spec.unit.scale;
    var nt = niceTicks(ymin / sc, (ymax || 1) * 1.06 / sc, 4);
    var top = nt.ticks[nt.ticks.length - 1] * sc;
    if (top < ymax * 1.02) top = (nt.ticks[nt.ticks.length - 1] + nt.step) * sc;
    var bot = Math.min(0, nt.ticks[0] * sc);
    var ys = function (y) { return MT + (1 - (y - bot) / (top - bot || 1)) * (H - MT - MB); };
    var o = [];
    o.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(spec.m.name) + '">');
    o.push('<defs><clipPath id="c' + id + '"><rect x="' + ML + '" y="0" width="' + (W - ML - MR) + '" height="' + (H - MB) + '"/></clipPath></defs>');
    nt.ticks.forEach(function (t) {
      var y = ys(t * sc);
      if (t * sc > top + 1e-9) return;
      o.push('<line x1="' + ML + '" x2="' + (W - MR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--line-2)"/>');
      o.push('<text x="' + (ML - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + num(t, nt.dp) + '</text>');
    });
    o.push('<text x="' + (ML - 6) + '" y="10" text-anchor="end">' + esc(spec.unit.short) + '</text>');
    var months = monthTicks(spec.x0, spec.x1);
    months.forEach(function (mt) {
      var x = xs(mt.x);
      o.push('<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + (H - MB) + '" y2="' + (H - MB + 4) + '" stroke="var(--line)"/>');
      o.push('<text x="' + x.toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' + mt.label + '</text>');
    });
    o.push('<line x1="' + ML + '" x2="' + (W - MR) + '" y1="' + ys(bot).toFixed(1) + '" y2="' + ys(bot).toFixed(1) + '" stroke="var(--line)"/>');
    o.push('<g clip-path="url(#c' + id + ')">');
    var fc = spec.fc;
    if (fc.length > 1) {
      var band = fc.filter(function (k) { return k.lo != null && k.hi != null; });
      if (band.length > 1) {
        var first = fc[0];
        var poly = [[first.x, first.y]].concat(band.map(function (k) { return [k.x, k.hi]; }))
          .concat(band.slice().reverse().map(function (k) { return [k.x, k.lo]; }));
        o.push('<path d="M' + poly.map(function (p) { return xs(p[0]).toFixed(1) + ',' + ys(p[1]).toFixed(1); }).join('L') + 'Z" fill="var(--band)"/>');
      }
    }
    spec.lines.slice().reverse().forEach(function (l) {
      var d = pathOf(l.pts, xs, ys);
      if (l.role === 0) {
        var area = areaOf(l.pts, xs, ys, ys(Math.max(bot, 0)));
        if (area) o.push('<path d="' + area + '" fill="var(--data-fill)"/>');
        o.push('<path d="' + d + '" fill="none" stroke="var(--data)" stroke-width="1.8" stroke-linejoin="round"/>');
      } else {
        o.push('<path d="' + d + '" fill="none" stroke="var(--data-2)" stroke-width="1.3" stroke-linejoin="round"/>');
      }
    });
    if (fc.length > 1) {
      o.push('<path d="M' + fc.map(function (k) { return xs(k.x).toFixed(1) + ',' + ys(k.y).toFixed(1); }).join('L') + '" fill="none" stroke="var(--data)" stroke-width="1.6" stroke-dasharray="5 4"/>');
    }
    spec.limits.forEach(function (l) {
      var y = ys(l.y).toFixed(1);
      var col = !spec.hot ? 'var(--ink-3)' : l.cls === 'lim' ? 'var(--limit)' : 'var(--thresh)';
      o.push('<line x1="' + ML + '" x2="' + (W - MR) + '" y1="' + y + '" y2="' + y + '" stroke="' + col + '" stroke-width="1" stroke-dasharray="' + (l.cls === 'lim' ? '6 4' : '2 3') + '"' + (spec.hot ? '' : ' opacity=".7"') + '/>');
    });
    var cross = crossing(spec);
    if (cross) {
      o.push('<circle cx="' + xs(cross.x).toFixed(1) + '" cy="' + ys(cross.y).toFixed(1) + '" r="3.5" fill="' + (spec.hot ? 'var(--limit)' : 'var(--ink-2)') + '" stroke="var(--surface)" stroke-width="2"/>');
    }
    spec.esm.forEach(function (k) {
      var x = xs(k.x), y = ys(k.y);
      if (k.lo != null && k.hi != null && (k.hi - k.lo) < (top - bot) * 0.6) o.push('<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + ys(k.lo).toFixed(1) + '" y2="' + ys(k.hi).toFixed(1) + '" stroke="var(--esm)" stroke-width="1.5"/>');
      o.push('<rect x="' + (x - 4).toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" width="8" height="8" fill="var(--esm)" transform="rotate(45 ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>');
    });
    spec.lines.forEach(function (l) {
      l.pts.forEach(function (p) {
        if (p.a === 1 || p.a === -1) {
          var recent = p.x > LAST - ANOM_DAYS;
          if (recent) o.push('<circle cx="' + xs(p.x).toFixed(1) + '" cy="' + ys(p.y).toFixed(1) + '" r="3" fill="var(--surface)" stroke="' + (p.a === 1 ? 'var(--crit)' : 'var(--accent)') + '" stroke-width="1.5"/>');
          else o.push('<circle cx="' + xs(p.x).toFixed(1) + '" cy="' + ys(p.y).toFixed(1) + '" r="1.75" fill="var(--ink-3)"/>');
        }
      });
    });
    o.push('</g>');
    var tx = xs(LAST).toFixed(1);
    o.push('<line x1="' + tx + '" x2="' + tx + '" y1="' + MT + '" y2="' + (H - MB) + '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="1 3"/>');
    o.push('<text x="' + tx + '" y="10" text-anchor="middle">today</text>');
    spec.limits.forEach(function (l) {
      var y = ys(l.y), lim = l.cls === 'lim';
      var tc = !spec.hot ? 'var(--ink-3)' : lim ? 'var(--limit)' : 'var(--thresh)';
      o.push('<text x="' + (lim ? W - MR - 2 : ML + 4) + '" y="' + (y + (lim ? -4 : 11)).toFixed(1) + '" text-anchor="' + (lim ? 'end' : 'start') + '" class="lbl" style="fill:' + tc + '">' + esc(l.label) + '</text>');
    });
    if (cross) {
      o.push('<text x="' + (xs(cross.x) - 6).toFixed(1) + '" y="' + (ys(cross.y) + 15).toFixed(1) + '" text-anchor="end" class="stmp" style="fill:' + (spec.hot ? 'var(--limit)' : 'var(--ink-2)') + '">\u2192 ' + fDay(Math.round(cross.x)) + '</text>');
    }
    o.push('<line class="hx" x1="0" x2="0" y1="' + MT + '" y2="' + (H - MB) + '" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>');
    o.push('<circle class="hd" r="4" fill="var(--data)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>');
    o.push('<rect x="' + ML + '" y="0" width="' + (W - ML - MR) + '" height="' + (H - MB) + '" fill="transparent" class="hit"/>');
    o.push('</svg>');
    spec.xs = xs; spec.ys = ys;
    return o.join('');
  }

  function crossing(spec) {
    var lim = spec.limits.filter(function (l) { return l.target; })[0];
    if (!lim || spec.fc.length < 2) return null;
    var fc = spec.fc;
    for (var i = 1; i < fc.length; i++) {
      var a = fc[i - 1], b = fc[i];
      if (a.y < lim.y && b.y >= lim.y) {
        var x = a.x + (lim.y - a.y) / (b.y - a.y) * (b.x - a.x);
        return x <= spec.x1 ? { x: x, y: lim.y } : null;
      }
    }
    return null;
  }

  function pathOf(pts, xs, ys) {
    var d = '', pen = false, prev = null;
    pts.forEach(function (p) {
      if (p.y == null || (prev != null && p.x - prev > 1.5)) pen = false;
      if (p.y != null) {
        d += (pen ? 'L' : 'M') + xs(p.x).toFixed(1) + ',' + ys(p.y).toFixed(1);
        pen = true;
        prev = p.x;
      }
    });
    return d;
  }
  function areaOf(pts, xs, ys, base) {
    var v = pts.filter(function (p) { return p.y != null; });
    if (v.length < 2) return '';
    return 'M' + xs(v[0].x).toFixed(1) + ',' + base.toFixed(1) + v.map(function (p) {
      return 'L' + xs(p.x).toFixed(1) + ',' + ys(p.y).toFixed(1);
    }).join('') + 'L' + xs(v[v.length - 1].x).toFixed(1) + ',' + base.toFixed(1) + 'Z';
  }

  function monthTicks(x0, x1) {
    var out = [], d = dateOf(x0);
    var y = d.getUTCFullYear(), mo = d.getUTCMonth() + 1;
    var span = x1 - x0, every = span > 400 ? 3 : span > 200 ? 2 : 1;
    for (;;) {
      if (mo > 11) { mo = 0; y++; }
      var x = Date.UTC(y, mo, 1) / MS_DAY;
      if (x > x1) break;
      if (mo % every === 0) out.push({ x: x, label: mo === 0 ? MONTHS[0] + ' \u2019' + String(y).slice(2) : MONTHS[mo] });
      mo++;
    }
    return out;
  }

  function legendHtml(spec) {
    var o = [];
    if (spec.lines.length > 1) {
      o.push('<span><i></i>' + esc(spec.lines[0].label) + '</span>');
      o.push('<span><i class="l2"></i>' + esc(spec.lines[1].label) + '</span>');
    }
    return o.length ? '<div class="legend">' + o.join('') + '</div>' : '';
  }

  function sparkSvg(m, w, h) {
    var spec = chartSpec(m);
    var l = spec.lines[0];
    if (!l) return '<svg viewBox="0 0 ' + w + ' ' + h + '"></svg>';
    var x0 = Math.max(spec.x0, LAST - 120), x1 = LAST + 30;
    var ymax = 0;
    l.pts.forEach(function (p) { if (p.x >= x0 && p.y != null) ymax = Math.max(ymax, p.y); });
    spec.limits.slice(0, 1).forEach(function (lim) { ymax = Math.max(ymax, lim.y); });
    if (spec.pctAxis) ymax = Math.max(ymax, 100);
    var xs = function (x) { return 1 + (x - x0) / (x1 - x0) * (w - 2); };
    var ys = function (y) { return h - 2 - y / (ymax * 1.05 || 1) * (h - 4); };
    var pts = l.pts.filter(function (p) { return p.x >= x0; });
    var o = ['<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">'];
    var area = areaOf(pts, xs, ys, h - 1);
    if (area) o.push('<path d="' + area + '" fill="var(--data-fill)"/>');
    o.push('<path d="' + pathOf(pts, xs, ys) + '" fill="none" stroke="var(--data)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>');
    var fc = spec.fc.filter(function (k) { return k.x <= x1 + 60; });
    if (fc.length > 1) o.push('<path d="M' + fc.map(function (k) { return xs(k.x).toFixed(1) + ',' + ys(k.y).toFixed(1); }).join('L') + '" fill="none" stroke="var(--data)" stroke-width="1.2" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>');
    if (spec.limits[0]) {
      var y = ys(spec.limits[0].y).toFixed(1);
      o.push('<line x1="0" x2="' + w + '" y1="' + y + '" y2="' + y + '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>');
    }
    pts.forEach(function (p) {
      if ((p.a === 1 || p.a === -1) && p.x > LAST - ANOM_DAYS) o.push('<circle cx="' + xs(p.x).toFixed(1) + '" cy="' + ys(p.y).toFixed(1) + '" r="2" fill="' + (p.a === 1 ? 'var(--crit)' : 'var(--accent)') + '"/>');
    });
    o.push('</svg>');
    return o.join('');
  }

  /* ---------- hour heat strip (CPU) ---------- */

  function heatSvg(m) {
    var h = HOURS[key(m.f.dbid, m.f.con, m.fam.heat)];
    if (!h || !h.d.length) return '';
    var t0 = dayN(h.t0), rows = 14, cw = 21, rh = 13, lw = 70, top = 2;
    var w = lw + cw * 24, ht = top + rows * rh + 16;
    var grid = {};
    h.d.forEach(function (r) { grid[r[0] + '|' + r[1]] = r; });
    var o = ['<svg viewBox="0 0 ' + w + ' ' + ht + '" role="img" aria-label="hourly CPU, last 14 days">'];
    for (var r = 0; r < rows; r++) {
      var day = t0 + r, y = top + r * rh;
      o.push('<text x="' + (lw - 6) + '" y="' + (y + rh - 3) + '" text-anchor="end">' + fWDay(day) + '</text>');
      for (var c = 0; c < 24; c++) {
        var cell = grid[r + '|' + c], x = lw + c * cw;
        var fill = 'var(--heat-0)', stroke = '';
        if (cell && cell[2] != null) {
          var v = Math.max(0, Math.min(100, cell[2]));
          fill = 'color-mix(in oklab, var(--heat-1) ' + Math.round(v) + '%, var(--heat-0))';
          if (cell[3] === 1) stroke = ' stroke="var(--crit)" stroke-width="2"';
          if (cell[3] === -1) stroke = ' stroke="var(--accent)" stroke-width="2"';
        }
        o.push('<rect class="hc" data-d="' + day + '" data-h="' + c + '" data-v="' + (cell && cell[2] != null ? cell[2] : '') + '" data-f="' + (cell ? cell[3] : 0) + '" x="' + (x + 0.5) + '" y="' + (y + 0.5) + '" width="' + (cw - 1) + '" height="' + (rh - 1) + '" rx="1.5" fill="' + fill + '"' + stroke + '/>');
      }
    }
    [0, 6, 12, 18].forEach(function (hr) {
      o.push('<text x="' + (lw + hr * cw + cw / 2) + '" y="' + (top + rows * rh + 12) + '" text-anchor="middle">' + (hr < 10 ? '0' : '') + hr + ':00</text>');
    });
    o.push('</svg>');
    return '<div class="heat"><div class="hh"><span>Hourly, last 14 days, by hour ending</span><span class="ramp">0%<i></i>100%</span></div>' + o.join('') + '</div>';
  }

  /* ---------- page pieces ---------- */

  function pill(sev, text) { return '<span class="st ' + SEV_CLASS[sev] + '">' + esc(text || SEV_LABEL[sev]) + '</span>'; }
  function sdot(sev) { return '<span class="dot ' + SEV_CLASS[sev] + '"></span>'; }

  function factsHtml(facts) {
    return '<div class="facts">' + facts.map(function (f) {
      return '<div class="fact ' + (f.tone || '') + '"><div class="l">' + esc(f.l) + '</div><div class="v">' + f.v + '</div>' +
        (f.s ? '<div class="s">' + esc(f.s) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }

  function tagsHtml(m) {
    var t = [];
    if (QUALITY_TAG[m.f.q]) t.push(QUALITY_TAG[m.f.q]);
    if (m.f.cur === 0) t.push('no longer reported');
    if (m.f.limSrc && m.f.limSrc !== 'MAXBYTES' && m.f.limSrc !== 'AUTOEXTEND' && m.fam.id === 'tablespaces') t.push('limit: ' + m.f.limSrc.toLowerCase());
    return t.map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('') +
      (m.trk && REL_TAG[m.trk.rel] ? '<span class="tag rel">' + REL_TAG[m.trk.rel] + '</span>' : '');
  }

  /* The forecast track record of the series (CAPR_FIT_TRACK): the view's
     sentence, and the +30 band at its factor when that widens the band. */
  function trackHtml(m) {
    var t = m.trk, cal = '';
    if (t.f > 1 && t.lo != null && t.hi != null && t.hi > t.lo) {
      cal = ' <span class="cal">+30 d band at that factor: ' + m.unit.fmt(t.lo) + ' \u2013 ' + m.unit.fmt(t.hi) + '</span>';
    }
    return '<p class="trk' + (REL_TAG[t.rel] ? ' off' : t.rel === 'UNKNOWN' ? ' unk' : '') + '"><span class="tl">Track record</span>' + esc(t.txt) + cal + '</p>';
  }

  function cardHtml(m) {
    var spec = chartSpec(m);
    var id = CHARTS.length;
    var svg = chartSvg(spec, id);
    CHARTS.push(spec);
    var o = ['<article class="card ' + SEV_CLASS[m.sev] + (m.fam.heat ? ' split' : '') + '" id="' + m.id + '">'];
    o.push('<div class="ch"><h3>' + esc(m.name) + '</h3>' + (m.ctr && m.ctr !== m.name ? '<span class="ctr">' + esc(m.ctr) + '</span>' : '') + tagsHtml(m) + pill(m.sev) + '</div>');
    var va = m.alerts[0];
    if (va && (m.sev === 'CRIT' || m.sev === 'WARN')) {
      o.push('<p class="verdict ' + SEV_CLASS[m.sev] + '">' + alertFact(va, m) + ' \u00b7 ' + alertWhen(va) + '</p>');
    }
    o.push(factsHtml(m.facts));
    o.push('<div class="viz"><div><div class="chart" data-chart="' + id + '">' + svg + '<div class="tip"></div></div>');
    o.push(legendHtml(spec) + '</div>');
    if (m.fam.heat) o.push(heatSvg(m));
    o.push('</div>');
    if (m.trk) o.push(trackHtml(m));
    var shifts = m.anoms.filter(function (a) { return a.ak === 'CPU_SHIFT'; });
    var evs = anomalyEvents(m);
    if (shifts.length || evs.length) {
      o.push('<div class="issues">');
      shifts.forEach(function (a) {
        o.push('<div class="iss">' + sdot(a.sev && SEV_RANK[a.sev] != null ? a.sev : 'INFO') + '<span>Level shift <b>' + sign(a.shift) + num(Math.abs(a.shift), 1) + '%</b> since ' + fDay(dayN(a.ts)) + '</span></div>');
      });
      if (evs.length) {
        var shown = evs.slice(0, 3);
        o.push('<div class="anoms"><div class="ah"><span>Unusual days</span><span>' + evs.length + ' in the last ' + ANOM_DAYS + ' d</span></div>' +
          shown.map(function (e) { return anomalyChip(e, m); }).join('') + '</div>');
      }
      o.push('</div>');
    }
    o.push('</article>');
    return o.join('');
  }

  function rowHtml(m) {
    var f = m.f;
    var pct = f.pct != null ? Math.max(0, Math.min(100, f.pct)) : null;
    var tone = pctTone(f.pct, m.fam.id === 'tablespaces' ? K.nfWarn : SERIES_SAT, m.fam.id === 'tablespaces' ? K.nfCrit : 100);
    var dtf = dtfFact(f, '');
    return '<div class="row" id="' + m.id + '"><div class="nm"><b>' + esc(m.name) + '</b><span>' + esc(m.ctr) + (QUALITY_TAG[f.q] ? ' \u00b7 ' + QUALITY_TAG[f.q] : '') + '</span></div>' +
      sparkSvg(m, 200, 30) +
      '<div class="c keep">' + (pct != null ? num(f.pct, 1) + '%<div class="bar"><i class="' + tone + '" style="width:' + pct + '%"></i></div>' : m.unit.fmt(f.v)) + '</div>' +
      '<div class="c">' + m.unit.rate(f.slope) + '<span>growth</span></div>' +
      '<div class="c">' + dtf.v + '<span>' + esc(dtf.s) + '</span></div>' + pill(m.sev) + '</div>';
  }

  function familySummary(fam, ms) {
    var c = { CRIT: 0, WARN: 0, INFO: 0 };
    ms.forEach(function (m) { if (c[m.sev] != null) c[m.sev]++; });
    var parts = ['<b>' + ms.length + '</b> ' + fam.noun + (ms.length === 1 ? '' : 's')];
    if (c.CRIT) parts.push('<b>' + c.CRIT + '</b> critical');
    if (c.WARN) parts.push('<b>' + c.WARN + '</b> warning');
    var soon = ms.filter(function (m) { return m.f.dtf != null && m.f.q === 'OK'; })
      .sort(function (a, b) { return a.f.dtf - b.f.dtf; })[0];
    if (soon && !fam.flow) {
      var what = fam.id === 'tablespaces' ? 'full' : fam.id.indexOf('cpu') >= 0 ? CPU_SAT + '%' : SERIES_SAT + '%';
      parts.push('soonest ' + what + ': <b>' + esc(soon.name) + '</b> in ' + fDays(soon.f.dtf));
    }
    return parts.map(function (p) { return '<span>' + p + '</span>'; }).join('');
  }

  function headline(fam, ms) {
    var m = ms[0];
    if (!m) return '';
    var a = m.alerts[0];
    if (a && m.sev !== 'OK') {
      var fact = /_ANOM$/.test(a.kind) ? 'unusual ' + fDay(dayN(a.day)) : alertFact(a, m).replace(/<\/?b>/g, '');
      return '<b>' + esc(m.name) + '</b> ' + fact;
    }
    var f = m.f;
    if (fam.id === 'tablespaces') {
      var full = ms.slice().sort(function (x, y) { return (y.f.pct || 0) - (x.f.pct || 0); })[0];
      return 'fullest <b>' + esc(full.name) + '</b> ' + num(full.f.pct, 1) + '%';
    }
    if (f.k === 'CPU') return '<b>' + esc(m.name) + '</b> p95 ' + num(f.v, 1) + '%';
    if (fam.flow) return '<b>' + m.unit.fmt(lastVal(m.pts)) + '</b> ' + fam.flow;
    return '<b>' + esc(m.name) + '</b> ' + m.unit.fmt(f.v) + (f.pct != null ? ' \u00b7 ' + num(f.pct, 1) + '%' : '');
  }

  /* ---------- overview: space growth rates ---------- */

  var SPACE_TOP = 5;

  function famMetrics(id) {
    var s = sections.filter(function (x) { return x.fam.id === id; })[0];
    return s ? s.ms : [];
  }
  /* The rate a tablespace fills at: a cyclic one is judged on its peaks. */
  function fillRate(f) { return f.q === 'CYCLIC' ? f.pkSlope : f.slope; }
  function observedChange(pts, days) {
    var last = null, first = null;
    for (var i = pts.length - 1; i >= 0; i--) {
      var p = pts[i];
      if (p.y == null) continue;
      if (last == null) last = p;
      if (p.x >= last.x - days) first = p; else break;
    }
    return last && first && last.x > first.x ? { d: last.y - first.y, n: last.x - first.x } : null;
  }

  function spaceRow(m, cells) {
    return '<a class="grow" href="#' + m.id + '"><span class="s">' + esc(m.name) + ' <span>' + esc(m.ctr) +
      (QUALITY_TAG[m.f.q] ? ' \u00b7 ' + QUALITY_TAG[m.f.q] : '') + '</span></span>' +
      cells.map(function (c) { return '<span class="c">' + c + '</span>'; }).join('') + '</a>';
  }

  /* The tablespace with the fewest days to full, as one sentence. */
  function fillsFirstHtml(ts) {
    var first = ts.filter(function (m) { return m.f.dtf != null && m.f.q !== 'INSUFFICIENT_HISTORY'; })
      .sort(function (a, b) { return a.f.dtf - b.f.dtf; })[0];
    if (!first) return '<div class="lead">No tablespace is on course to fill.</div>';
    var f = first.f, tone = dtfFact(f, '').tone;
    return '<a class="lead" href="#' + first.id + '">Fills first: <b>' + esc(first.name) + '</b> <span>' + esc(first.ctr) +
      (QUALITY_TAG[f.q] ? ' \u00b7 ' + QUALITY_TAG[f.q] : '') + '</span>, ' +
      (f.dtf > 3650 ? 'full <b>not in sight</b>' : 'full in <b class="' + (tone || '') + '">' + fDays(f.dtf) + '</b> (' + (f.dtf > 120 ? Math.round(f.dtf) + ' d, ' : '') + 'by ' + fDayY(Math.round(LAST + f.dtf)) + ')') +
      ' at ' + first.unit.rate(fillRate(f)) + ', ' + num(f.pct, 1) + '% used now</a>';
  }

  /* The disk the datafiles of a database share (CAPR_DISK): one sentence each. */
  function diskHtml() {
    var ds = D.disks || [];
    if (!ds.length) return '';
    return '<h3>Shared disk</h3>' + ds.map(function (d) {
      var head = '<div class="lead">' + esc(d.db) + ' <span>' + esc(d.disk) + '</span>: ';
      if (d.free == null) return head + 'free space not known. Set it in CAP_DISK_OVERRIDE to forecast the disk.</div>';
      var tone = d.sev === 'CRIT' ? 'crit' : d.sev === 'WARN' ? 'warn' : '';
      return head + '<b>' + num(d.free, 1) + ' GiB</b> free (' +
        (d.src === 'OVERRIDE' ? 'set by the operator' : 'from the live tablespace ceilings') + (d.asOf ? ', ' + fDay(dayN(d.asOf)) : '') + '), ' +
        (d.dtf != null ? 'full in <b class="' + tone + '">' + fDays(d.dtf) + '</b>' + (d.fullDay ? ' (by ' + fDayY(dayN(d.fullDay)) + (d.dtfW != null ? ', worst case ' + fDays(d.dtfW) : '') + ')' : '')
          : 'does <b>not fill</b> at the fitted rates') +
        '. ' + (d.nGrow || 0) + ' growing tablespaces take ' + num(d.grow, 1) + ' MiB a day' + (d.top ? ': ' + esc(d.top) + ' MiB/day' : '') + '</div>';
    }).join('');
  }

  function spaceHtml() {
    var ts = famMetrics('tablespaces'), dbs = famMetrics('db-size');
    if (!ts.length && !dbs.length) return '';
    var out = ['<div class="rates">'];

    if (dbs.length) {
      out.push('<h3>Database size</h3><div class="ghead"><span></span><span>size</span><span>per day</span><span>per 30 d</span><span>last 30 d</span></div>');
      dbs.forEach(function (m) {
        var f = m.f, obs = observedChange(m.pts, 30);
        out.push(spaceRow(m, [m.unit.fmt(f.v), m.unit.rate(f.slope),
          f.slope == null ? '\u2013' : sign(f.slope) + m.unit.fmt(Math.abs(f.slope) * 30),
          obs ? sign(obs.d) + m.unit.fmt(Math.abs(obs.d)) : '\u2013']));
      });
    }
    if (ts.length) {
      var fastest = ts.filter(function (m) { return fillRate(m.f) > 0; }).sort(function (a, b) {
        var da = a.f.dtf == null ? 1e9 : a.f.dtf, db = b.f.dtf == null ? 1e9 : b.f.dtf;
        return da - db || fillRate(b.f) - fillRate(a.f);
      }).slice(0, SPACE_TOP);
      out.push('<h3>Fastest-filling tablespaces</h3>' + fillsFirstHtml(ts));
      if (!fastest.length) out.push('<div class="allok">No tablespace is growing</div>');
      else out.push('<div class="ghead"><span></span><span>used</span><span>per day</span><span>per 30 d</span><span>full in</span></div>');
      fastest.forEach(function (m) {
        var f = m.f, r = fillRate(f);
        out.push(spaceRow(m, [num(f.pct, 1) + '%', m.unit.rate(r), sign(r) + fBytes(Math.abs(r) * 30), dtfFact(f, '').v]));
      });
      out.push(diskHtml());
    }
    out.push('</div>');
    return out.join('');
  }

  /* ---------- memory: sizing verdicts per instance (advice, not alerts) ---------- */

  var GRADE_LABEL = {
    UNDERSIZED: 'undersized', OVERSIZED: 'oversized', THRASHING: 'thrashing', DRIFTING: 'drifting',
    OK: 'OK', INSUFFICIENT_EVIDENCE: 'insufficient evidence'
  };
  var GRADE_ORDER = { UNDERSIZED: 0, THRASHING: 0, DRIFTING: 1, OVERSIZED: 2 };
  var DIR_MARK = { PRESSURE: ['pr', '\u25b2 pressure'], SLACK: ['sl', '\u25bc slack'], NEUTRAL: ['nu', '\u00b7 neutral'] };
  var MEM_EV = groupBy(D.memEvidence, function (e) { return key(e.dbid, e.inst, e.area); });
  var MEM_PTS = groupBy(D.memPoints, function (p) { return key(p.dbid, p.inst); });
  var MEM_V = groupBy(D.memVerdicts, function (v) { return key(v.dbid, v.inst); });
  var memCards = Object.keys(MEM_V).map(function (k) {
    var vs = MEM_V[k].slice().sort(function (a, b) { return a.ar - b.ar; });
    return { v: vs[0], vs: vs, id: 'memory-' + vs[0].dbid + '-' + vs[0].inst, pts: MEM_PTS[k] || [] };
  });
  var memInstances = groupBy(memCards, function (c) { return c.v.dbid; });
  var MCHARTS = [];
  var MW = 480, MH = 200, MML = 44, MMR = 10, MMT = 22, MMB = 24;

  function gradeName(g) { return GRADE_LABEL[g] || String(g || '').toLowerCase().replace(/_/g, ' '); }
  function gradeTone(v) { return v.act === 'Y' ? 'act' : v.g === 'INSUFFICIENT_EVIDENCE' ? 'ie' : 'ok'; }
  /* As the view prints a size: whole GiB when it is a multiple of 1 GiB, else whole MiB. */
  function memSize(b) {
    if (b == null) return '\u2013';
    return b % Math.pow(1024, 3) === 0 ? b / Math.pow(1024, 3) + ' GiB' : Math.round(b / Math.pow(1024, 2)) + ' MiB';
  }
  function memRange(lo, hi) {
    var a = memSize(lo), b = memSize(hi);
    return a.slice(-4) === b.slice(-4) ? a.slice(0, -4) + '\u2013' + b : a + ' \u2013 ' + b;
  }
  function memName(c) {
    var n = conLabel(c.v.dbid, c.v.con);
    return memInstances[c.v.dbid].length > 1 ? n + ' instance ' + c.v.inst : n;
  }

  /* The component points as stacked bands: the largest component at the bottom. */
  function memStack(pts) {
    var comps = pts.map(function (p) {
      var t0 = dayN(p.t0), byX = {}, lastX = null, cur = 0, lo = null, hi = null, ops = 0;
      p.d.forEach(function (r) {
        var x = t0 + r[0], b = r[1] || 0;
        byX[x] = { b: b, lo: r[2], hi: r[3], ops: r[4] || 0 };
        if (lastX == null || x > lastX) { lastX = x; cur = b; }
        if (r[2] != null) lo = lo == null ? r[2] : Math.min(lo, r[2]);
        if (r[3] != null) hi = hi == null ? r[3] : Math.max(hi, r[3]);
        ops += r[4] || 0;
      });
      return { c: p.c, byX: byX, cur: cur, lo: lo, hi: hi, ops: ops };
    }).sort(function (a, b) { return b.cur - a.cur || (a.c < b.c ? -1 : 1); });
    comps.forEach(function (c, i) { c.cls = 'mc' + (i % 6); });
    var seen = {};
    comps.forEach(function (c) { Object.keys(c.byX).forEach(function (x) { seen[x] = 1; }); });
    var days = Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
    var total = comps.reduce(function (s, c) { return s + c.cur; }, 0);
    return { comps: comps, days: days, total: total };
  }
  function memAt(c, d) { return c.byX[d] ? c.byX[d].b : 0; }
  function memMoved(c, d) { var p = c.byX[d]; return !!p && (p.ops > 0 || (p.lo != null && p.hi != null && p.hi > p.lo)); }

  function memChartSvg(st, id) {
    var days = st.days, x1 = days[days.length - 1], x0 = days.length > 1 ? days[0] : x1 - 1;
    var ymax = 0;
    days.forEach(function (d) { ymax = Math.max(ymax, st.comps.reduce(function (s, c) { return s + memAt(c, d); }, 0)); });
    var u = unitFor('bytes', ymax);
    var nt = niceTicks(0, (ymax || 1) * 1.04 / u.scale, 4);
    var top = nt.ticks[nt.ticks.length - 1] * u.scale;
    if (top < ymax * 1.02) top = (nt.ticks[nt.ticks.length - 1] + nt.step) * u.scale;
    var xs = function (x) { return MML + (x - x0) / (x1 - x0) * (MW - MML - MMR); };
    var ys = function (y) { return MMT + (1 - y / (top || 1)) * (MH - MMT - MMB); };
    var o = ['<svg viewBox="0 0 ' + MW + ' ' + MH + '" role="img" aria-label="SGA components by day">'];
    nt.ticks.forEach(function (t) {
      var y = ys(t * u.scale).toFixed(1);
      o.push('<line x1="' + MML + '" x2="' + (MW - MMR) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line-2)"/>');
      o.push('<text x="' + (MML - 6) + '" y="' + (+y + 3.5).toFixed(1) + '" text-anchor="end">' + num(t, nt.dp) + '</text>');
    });
    o.push('<text x="' + (MML - 6) + '" y="10" text-anchor="end">' + u.short + '</text>');
    var base = days.map(function () { return 0; });
    st.comps.forEach(function (c) {
      var hi = days.map(function (d, i) { return base[i] + memAt(c, d); });
      var up = days.map(function (d, i) { return xs(d).toFixed(1) + ',' + ys(hi[i]).toFixed(1); });
      var down = days.map(function (d, i) { return xs(d).toFixed(1) + ',' + ys(base[i]).toFixed(1); }).reverse();
      if (days.length === 1) {
        up.unshift(xs(x0).toFixed(1) + ',' + ys(hi[0]).toFixed(1));
        down.push(xs(x0).toFixed(1) + ',' + ys(base[0]).toFixed(1));
      }
      o.push('<path class="' + c.cls + '" d="M' + up.join('L') + 'L' + down.join('L') + 'Z" stroke="var(--surface)" stroke-width=".75" stroke-linejoin="round"/>');
      base = hi;
    });
    o.push('<line x1="' + MML + '" x2="' + (MW - MMR) + '" y1="' + ys(0).toFixed(1) + '" y2="' + ys(0).toFixed(1) + '" stroke="var(--line)"/>');
    days.forEach(function (d) {
      if (st.comps.some(function (c) { return memMoved(c, d); })) {
        o.push('<rect class="mrz" x="' + (xs(d) - 1.5).toFixed(1) + '" y="' + (MH - MMB + 2) + '" width="3" height="6" fill="var(--accent)"/>');
      }
    });
    for (var d = x1; d >= x0; d -= 7) {
      var x = xs(d);
      o.push('<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + (MH - MMB) + '" y2="' + (MH - MMB + 4) + '" stroke="var(--line)"/>');
      o.push('<text x="' + x.toFixed(1) + '" y="' + (MH - 7) + '" text-anchor="' + (x > MW - MMR - 20 ? 'end' : 'middle') + '">' + fDay(d) + '</text>');
    }
    o.push('<line class="hx" x1="0" x2="0" y1="' + MMT + '" y2="' + (MH - MMB) + '" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>');
    o.push('<rect x="' + MML + '" y="0" width="' + (MW - MML - MMR) + '" height="' + (MH - MMB) + '" fill="transparent" class="hit"/>');
    o.push('</svg>');
    MCHARTS[id] = { st: st, x0: x0, x1: x1, xs: xs };
    return o.join('');
  }

  function memLegendHtml(st) {
    return '<div class="mlg"><div class="mlh"><span>SGA component</span><span>now</span><span>share</span><span>in the window</span></div>' +
      st.comps.map(function (c) {
        var moved = c.ops > 0 || (c.lo != null && c.hi != null && c.hi > c.lo);
        return '<div class="mlr"><span class="mn"><i class="' + c.cls + '"></i>' + esc(c.c) + '</span><span>' + memSize(c.cur) + '</span>' +
          '<span>' + (st.total ? num(100 * c.cur / st.total, 1) + '%' : '\u2013') + '</span>' +
          '<span class="' + (moved ? 'mvd' : '') + '">' + (moved ? memRange(c.lo, c.hi) + ' \u00b7 ' + c.ops + ' op' + (c.ops === 1 ? '' : 's') : 'not resized') + '</span></div>';
      }).join('') +
      '<div class="mlf"><span><i class="mrzk"></i>a component was resized that day</span><span>total ' + memSize(st.total) + '</span></div></div>';
  }

  function memEvidenceHtml(v) {
    var ev = MEM_EV[key(v.dbid, v.inst, v.area)] || [];
    if (!ev.length) return '';
    var np = ev.filter(function (e) { return e.dir === 'PRESSURE'; }).length;
    return '<details class="mev"><summary>Evidence <span>' + ev.length + ' signal' + (ev.length === 1 ? '' : 's') + (np ? ', ' + np + ' pressure' : '') + '</span></summary><ul>' +
      ev.map(function (e) {
        var dm = DIR_MARK[e.dir] || ['nu', String(e.dir || '').toLowerCase()];
        return '<li class="' + dm[0] + '"><span class="dir">' + esc(dm[1]) + '</span><span class="kd">' + esc(String(e.kind || '').toLowerCase()) + '</span><span>' + esc(e.txt) + '</span></li>';
      }).join('') + '</ul></details>';
  }

  function memRowHtml(v) {
    var cur = v.curS || (v.cur != null ? memSize(v.cur) : '\u2013');
    var sz = '<span class="mcur">' + esc(cur) + '</span>';
    /* The view leaves change_pct NULL when the suggestion is a pool floor (SGA_BALANCE), not a new current size. */
    if (v.sugS && v.chg != null) {
      sz += '<span class="arr">\u2192</span><b>' + esc(v.sugS) + '</b><span class="chg">' + sign(v.chg) + num(Math.abs(v.chg), v.chg % 1 ? 1 : 0) + '%</span>';
    } else if (v.sugS) {
      sz += '<span class="arr">\u00b7</span>floor <b>' + esc(v.sugS) + '</b>';
    }
    if (v.par) sz += '<code>' + esc(v.par) + '</code>';
    var flags = [];
    if (v.ram === 'Y') flags.push('over the host memory share');
    if (v.sga === 'Y') flags.push('does not fit in sga_target');
    return '<div class="mrow ' + gradeTone(v) + '"><div class="mh"><span class="ma">' + esc(v.al || v.area) + '</span>' +
      '<span class="gp ' + gradeTone(v) + '">' + esc(gradeName(v.g)) + '</span><span class="msz">' + sz + '</span></div>' +
      (v.hl ? '<p class="mhl">' + esc(v.hl) + '</p>' : '') + (v.why ? '<p class="mwhy">' + esc(v.why) + '</p>' : '') +
      (flags.length ? '<div class="mflags">' + flags.map(function (f) { return '<span class="tag mflag">' + esc(f) + '</span>'; }).join('') + '</div>' : '') +
      memEvidenceHtml(v) + '</div>';
  }

  function memCardHtml(c) {
    var w0 = null, w1 = null, nd = null, mode = null;
    c.vs.forEach(function (v) {
      if (v.w0 && (w0 == null || dayN(v.w0) < w0)) w0 = dayN(v.w0);
      if (v.w1 && (w1 == null || dayN(v.w1) > w1)) w1 = dayN(v.w1);
      if (v.nd != null) nd = Math.max(nd || 0, v.nd);
      mode = mode || v.mode;
    });
    var multi = memInstances[c.v.dbid].length > 1;
    var o = ['<article class="card mem" id="' + c.id + '"><div class="ch"><h3>' + esc(conLabel(c.v.dbid, c.v.con)) + '</h3>' +
      (multi ? '<span class="ctr">instance ' + esc(c.v.inst) + '</span>' : '') + (mode ? '<span class="tag">' + esc(mode) + '</span>' : '') +
      (w1 != null ? '<span class="mwin">evidence ' + (w0 != null ? fDay(w0) + ' \u2013 ' : '') + fDayY(w1) + (nd != null ? ' \u00b7 ' + nd + ' sampled day' + (nd === 1 ? '' : 's') : '') + '</span>' : '') +
      '</div><div class="mbody"><div class="mvs">' + c.vs.map(memRowHtml).join('') + '</div><div class="mside">'];
    var st = c.pts.length ? memStack(c.pts) : null;
    if (st && st.days.length) {
      var id = MCHARTS.length;
      o.push('<h4>SGA components by day</h4><div class="mchart" data-mchart="' + id + '">' + memChartSvg(st, id) + '<div class="tip"></div></div>' + memLegendHtml(st));
    } else {
      o.push('<p class="mnone">No SGA component history in the window.</p>');
    }
    o.push('</div></div></article>');
    return o.join('');
  }

  function memActions() {
    var acts = [];
    memCards.forEach(function (c) { c.vs.forEach(function (v) { if (v.act === 'Y') acts.push({ c: c, v: v }); }); });
    return acts.sort(function (a, b) {
      var ga = GRADE_ORDER[a.v.g] != null ? GRADE_ORDER[a.v.g] : 3, gb = GRADE_ORDER[b.v.g] != null ? GRADE_ORDER[b.v.g] : 3;
      return ga - gb || a.v.ar - b.v.ar;
    });
  }

  function memSummary() {
    var n = memActions().length;
    return '<span><b>' + memCards.length + '</b> instance' + (memCards.length === 1 ? '' : 's') + '</span>' +
      '<span>' + (n ? '<b>' + n + '</b> change' + (n === 1 ? '' : 's') + ' advised' : 'no change advised') + '</span>' +
      '<span>advice only, not counted as alerts</span>';
  }

  function memHeadline() {
    var acts = memActions(), a = acts[0];
    if (!a) {
      var all = [];
      memCards.forEach(function (c) { all = all.concat(c.vs); });
      return all.every(function (v) { return v.g === 'INSUFFICIENT_EVIDENCE'; }) ? 'not enough evidence to judge' : 'no change advised';
    }
    return '<b>' + esc(a.v.al || a.v.area) + '</b> ' + esc(gradeName(a.v.g)) + (memCards.length > 1 ? ' on ' + esc(memName(a.c)) : '') +
      (acts.length > 1 ? ' \u00b7 ' + (acts.length - 1) + ' more change' + (acts.length > 2 ? 's' : '') + ' advised' : '');
  }

  /* The overview's strip: one cell per verdict, filled when it advises a change. */
  function memStripSvg() {
    var vs = [];
    memCards.forEach(function (c) { vs = vs.concat(c.vs); });
    var cw = Math.max(1, Math.min(24, 240 / vs.length - 3));
    return '<svg viewBox="0 0 240 28" preserveAspectRatio="xMinYMid meet" aria-hidden="true">' + vs.map(function (v, i) {
      var t = gradeTone(v), x = (i * (cw + 3) + 0.5).toFixed(1);
      return '<rect x="' + x + '" y="8.5" width="' + cw.toFixed(1) + '" height="11" rx="1.5" fill="' + (t === 'act' ? 'var(--accent)' : 'var(--surface)') + '"' +
        (t === 'act' ? '' : ' stroke="var(--line)"' + (t === 'ie' ? ' stroke-dasharray="2 2"' : '')) + '/>';
    }).join('') + '</svg>';
  }

  /* ---------- tablespace families: one tablespace per period, judged as a group ---------- */

  var FAM_M = groupBy(D.famMembers || [], function (m) { return key(m.dbid, m.con, m.f); });
  var FAM_BY = {};
  var famCards = (D.families || []).map(function (f, i) {
    var c = { f: f, id: 'family-' + i, ms: (FAM_M[key(f.dbid, f.con, f.f)] || []).slice().sort(function (a, b) { return a.seq - b.seq; }) };
    FAM_BY[key(f.dbid, f.con, f.f)] = c;
    return c;
  });
  var PERIOD_LABEL = { MONTH: 'monthly', QUARTER: 'quarterly', YEAR: 'yearly' };
  function gib(v) { return v == null ? '' : num(v, 2) + ' GiB'; }

  function famCardHtml(c) {
    var f = c.f, warn = f.sev === 'WARN';
    var o = ['<article class="fam card' + (warn ? ' warn' : '') + '" id="' + c.id + '"><div class="ch"><h3>' + esc(f.f) + '</h3>' +
      '<span class="ctr">' + esc(conLabel(f.dbid, f.con)) + '</span>' + (PERIOD_LABEL[f.per] ? '<span class="tag">' + PERIOD_LABEL[f.per] + '</span>' : '') +
      (warn ? pill('WARN') : '') + '</div><p class="mhl">' + esc(f.hl || '') + '</p><div class="fsz">' +
      '<span>' + f.nd + ' done, ' + f.nf + ' filling, ' + f.ne + ' empty</span>' +
      (f.next != null ? '<span>next member <b>' + gib(f.next) + '</b>, cautious ' + gib(f.nextHi) + (f.ts === 'Y' ? ' (trend)' : '') + '</span>' : '') +
      (f.exp != null ? '<span>' + esc(f.fm) + ' by ' + fDayY(dayN(f.pe)) + ' <b>' + gib(f.exp) + '</b>, at most ' + gib(f.expHi) + ' of ' + gib(f.lim) + '</span>' : '') +
      (f.gpp != null ? '<span>family ' + sign(f.gpp) + gib(Math.abs(f.gpp)) + ' a period</span>' : '') + '</div>'];
    o.push('<table class="ftab"><thead><tr><th>Member</th><th>State</th><th class="n">Used</th><th class="n">Ceiling</th><th class="n">Final</th><th>Filled</th></tr></thead><tbody>');
    c.ms.forEach(function (m) {
      var filled = m.st === 'FILLING' ? (m.ff ? 'since ' + fDay(dayN(m.ff)) : 'filling') + (m.rate != null ? ', ' + num(m.rate * 1024, 0) + ' MiB/d' : '')
        : m.fd != null ? m.fd + ' days to ' + fDay(dayN(m.ft)) : '';
      o.push('<tr class="' + esc(String(m.st || '').toLowerCase()) + '"><td>' + esc(m.t) + '</td><td>' + esc(String(m.st || '').toLowerCase()) + '</td>' +
        '<td class="n">' + gib(m.used) + '</td><td class="n">' + gib(m.lim) + '</td><td class="n">' + gib(m.fin) + '</td><td>' + filled + '</td></tr>');
    });
    o.push('</tbody></table></article>');
    return o.join('');
  }

  function famSummary() {
    var n = famCards.filter(function (c) { return c.f.sev === 'WARN'; }).length;
    return '<span><b>' + famCards.length + '</b> famil' + (famCards.length === 1 ? 'y' : 'ies') + '</span>' +
      '<span>' + (n ? '<b>' + n + '</b> filling member' + (n === 1 ? '' : 's') + ' over the ceiling' : 'every filling member fits') + '</span>';
  }

  /* ---------- assemble ---------- */

  var sections = FAMILIES.map(function (fam) {
    var ms = (D.fits || []).filter(fam.match).map(function (f) { return buildMetric(fam, f); });
    ms.sort(function (a, b) {
      for (var i = 0; i < a.order.length; i++) if (a.order[i] !== b.order[i]) return a.order[i] - b.order[i];
      return a.name < b.name ? -1 : 1;
    });
    return { fam: fam, ms: ms, sev: worstSev(ms.map(function (m) { return m.sev; })) };
  });
  var present = sections.filter(function (s) { return s.ms.length; });
  var absent = sections.filter(function (s) { return !s.ms.length; });
  var metricBySeries = {};
  present.forEach(function (sec) {
    sec.ms.forEach(function (m) {
      [m.f.s].concat(m.fam.related || []).forEach(function (s) { metricBySeries[key(m.f.dbid, m.f.con, s)] = m; });
    });
  });

  var alerts = (D.alerts || []).slice().sort(function (a, b) { return SEV_RANK[a.sev] - SEV_RANK[b.sev]; });
  var nCrit = alerts.filter(function (a) { return a.sev === 'CRIT'; }).length;
  var nWarn = alerts.filter(function (a) { return a.sev === 'WARN'; }).length;
  var nSeries = present.reduce(function (n, s) { return n + s.ms.length; }, 0);
  var nOk = present.reduce(function (n, s) { return n + s.ms.filter(function (m) { return m.sev === 'OK'; }).length; }, 0);

  var html = [];
  var dbName = (D.containers && D.containers[0] && D.containers[0].db) || M.db || '';
  document.title = 'Capacity \u00b7 ' + dbName + ' \u00b7 ' + (M.lastDay || '');
  var nCon = (D.containers || []).length;
  var esmLine = M.esm && M.esm.ok != null ? 'ESM models ' + M.esm.ok + ' ok, ' + (M.esm.failed || 0) + ' failed, ' + (M.esm.stale || 0) + ' stale' : '';
  html.push('<div class="page"><header class="mast"><span><b>' + esc(dbName) + '</b>' + esc(M.host || '') +
    (nCon > 1 ? ', ' + nCon + ' containers' : '') + (FIRST != null ? ', data ' + fDayY(FIRST) + ' \u2013 ' + fDayY(LAST) + ' (' + (LAST - FIRST + 1) + ' d)' : '') +
    '</span><span>Capacity report' + (LAST != null ? ' for ' + fDayY(LAST) : '') + '</span></header>');
  html.push('<p class="gen"><span>Generated ' + esc((M.generated || '').slice(0, 16)) + (M.schema ? ' from schema ' + esc(M.schema) : '') +
    (M.source && M.source !== 'LIVE' ? ' \u00b7 <b>' + esc(M.source) + '</b>' : '') + ' \u00b7 ' + present.length + ' metrics' + (esmLine ? ' \u00b7 ' + esmLine : '') + '</span>' +
    '<span class="tools"><button class="tbtn" id="themeBtn" type="button">Theme</button><button class="tbtn" type="button" onclick="window.print()">Print</button></span></p>');
  html.push('<nav class="nav"><a href="#overview">Overview</a>' + present.map(function (s) {
    return '<a class="' + SEV_CLASS[s.sev] + '" href="#' + s.fam.id + '">' + esc(s.fam.title) + '<span class="n">' + s.ms.length + '</span></a>';
  }).join('') + (memCards.length ? '<a href="#memory">Memory<span class="n">' + memCards.length + '</span></a>' : '') +
    (famCards.length ? '<a href="#families">Families<span class="n">' + famCards.length + '</span></a>' : '') + '</nav><main>');

  (D.errors || []).forEach(function (e) {
    html.push('<div class="banner">Data block \u201c' + esc(e.block) + '\u201d failed: ' + esc(e.msg) + '</div>');
  });
  alerts.filter(function (a) { return a.kind === 'DATA_STALE'; }).forEach(function (a) {
    html.push('<div class="banner">' + esc(conLabel(a.dbid, a.con)) + ': ' + alertFact(a) + '</div>');
  });
  if (GEN != null && LAST != null && GEN - LAST > 3) {
    html.push('<div class="banner warn">Newest AWR day is ' + fDayY(LAST) + ', ' + (GEN - LAST) + ' days before this report.</div>');
  }

  var listed = alerts.filter(function (a) { return a.sev === 'CRIT' || a.sev === 'WARN'; });
  var nFitOk = present.reduce(function (n, s) { return n + s.ms.filter(function (m) { return m.f.q === 'OK'; }).length; }, 0);
  var plural = function (n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); };
  html.push('<section id="overview" class="ov">');
  var top = listed[0];
  if (top) {
    var tm = metricBySeries[key(top.dbid, top.con, top.s)];
    var fact = /_ANOM$/.test(top.kind) ? 'unusual on ' + alertWhen(top)
      : alertFact(top, tm) + (top.unit === 'DAYS' || top.u === 'DAYS' ? ', on ' + fDay(Math.round(LAST + top.v)) : '');
    html.push('<h1>' + esc(tm ? tm.name : top.s) + ' ' + fact.replace(/<[^>]*>/g, '') + '.</h1>');
  } else {
    html.push('<h1>Nothing needs attention.</h1>');
  }
  html.push('<p class="lede">' + nCrit + ' critical and ' + plural(nWarn, 'warning') + ' across ' + nSeries + ' series in ' + plural(present.length, 'metric') + '.' +
    (absent.length ? ' No data for ' + absent.map(function (s) { return esc(s.fam.title); }).join(', ') + '.' : '') + '</p>');
  html.push('<div class="tally">' +
    '<div' + (nCrit ? ' class="crit"' : '') + '><b>' + nCrit + '</b><span>critical</span></div>' +
    '<div' + (nWarn ? ' class="warn"' : '') + '><b>' + nWarn + '</b><span>warning</span></div>' +
    '<div><b>' + nOk + '</b><span>of ' + nSeries + ' series healthy</span></div>' +
    '<div><b>' + nFitOk + '/' + nSeries + '</b><span>fits graded OK</span></div></div>');

  html.push(spaceHtml());

  html.push('<h3>By metric</h3><div class="idx">' + present.map(function (s) {
    var soon = s.ms.filter(function (m) { return m.f.dtf != null && m.f.q === 'OK' && m.f.dtf <= 365; })
      .sort(function (x, y) { return x.f.dtf - y.f.dtf; })[0];
    return '<a class="irow ' + SEV_CLASS[s.sev] + '" href="#' + s.fam.id + '">' + sdot(s.sev) + '<span class="it">' + esc(s.fam.title) + '</span>' +
      '<span class="ic">' + s.ms.length + '</span><span class="ih">' + headline(s.fam, s.ms) + '</span>' +
      sparkSvg(s.ms[0], 240, 28) + '<span class="iw">' + (soon ? stamp(LAST + soon.f.dtf) : '') + '</span></a>';
  }).join('') + (memCards.length ? '<a class="irow" href="#memory">' + sdot('OK') + '<span class="it">Memory</span><span class="ic">' + memCards.length + '</span>' +
    '<span class="ih">' + memHeadline() + '</span>' + memStripSvg() + '<span class="iw"></span></a>' : '') + '</div>');

  html.push('<h3>Needs attention <span>' + listed.length + ' open</span></h3><div class="attn">');
  if (!listed.length) html.push('<div class="allok">Nothing needs attention</div>');
  listed.forEach(function (a) {
    var m = metricBySeries[key(a.dbid, a.con, a.s)];
    var fc = !m && a.kind === 'TBSPC_FAMILY' ? FAM_BY[key(a.dbid, a.con, a.s)] : null;
    var href = m ? '#' + m.id : fc ? '#' + fc.id : '#overview';
    html.push('<a class="arow ' + SEV_CLASS[a.sev] + '" href="' + href + '">' + pill(a.sev) + '<span class="m">' + esc(m ? m.fam.title : fc ? 'Tablespace family' : a.kind) + '</span>' +
      '<span class="s">' + esc(m ? m.name : a.s) + ' <span>' + esc(m ? m.ctr : conLabel(a.dbid, a.con)) + '</span></span>' +
      '<span class="f">' + alertFact(a, m) + '</span><span class="d">' + alertWhen(a) + '</span></a>');
  });
  html.push('</div>');
  if (M.noisy > 0) {
    html.push('<p class="noisy">' + M.noisy + ' anomaly series ' + (M.noisy === 1 ? 'alerts' : 'alert') + ' often' +
      (M.noisyDays ? ' in the last ' + M.noisyDays + ' days' : '') +
      '. Run doctor.sql: section 12 lists them with the knob change that quiets each.</p>');
  }
  html.push('</section>');
  html.push('<div class="key"><span><i class="k-hist"></i>history</span><span><i class="k-fc"></i>forecast</span><span><i class="k-bd"></i>95% band</span>' +
    '<span><i class="k-lim"></i>limit</span><span><i class="k-thr"></i>warning line</span><span><i class="k-un"></i>unusual day, last ' + ANOM_DAYS + ' d</span>' +
    '<span><i class="k-old"></i>older unusual day</span><span><i class="k-es"></i>ESM +30 d</span><span><span class="stamp">\u2192 3 Nov</span> reaches the line</span></div>');

  html.push('<div class="secgrid">');
  present.forEach(function (s) {
    var wide = s.ms.length > 1 || s.fam.heat;
    html.push('<section id="' + s.fam.id + '"' + (wide ? ' class="wide"' : '') + '><div class="sh"><h2>' + esc(s.fam.title) + '</h2><div class="sum">' + familySummary(s.fam, s.ms) + '</div></div>');
    var full = s.ms.slice(0, TOP_N), rest = s.ms.slice(TOP_N);
    html.push('<div class="cards">' + full.map(cardHtml).join('') + '</div>');
    if (rest.length) {
      html.push('<div class="rows"><h3>' + rest.length + ' more ' + s.fam.noun + (rest.length === 1 ? '' : 's') + '</h3>' + rest.map(rowHtml).join('') + '</div>');
    }
    html.push('</section>');
  });
  if (memCards.length) {
    html.push('<section id="memory" class="wide"><div class="sh"><h2>Memory</h2><div class="sum">' + memSummary() + '</div></div>' +
      '<div class="cards">' + memCards.map(memCardHtml).join('') + '</div></section>');
  }
  if (famCards.length) {
    html.push('<section id="families" class="wide"><div class="sh"><h2>Tablespace families</h2><div class="sum">' + famSummary() + '</div></div>' +
      '<div class="cards">' + famCards.map(famCardHtml).join('') + '</div></section>');
  }
  html.push('</div></main><footer class="foot"><span>' + esc(M.db) + '</span><span>schema ' + esc(M.schema) + '</span><span>suite ' + esc(K.suiteVersion || '') + '</span>' +
    '<span>' + esc(M.run || '') + '</span><span>read-only</span><span>' + esc(M.file || '') + '</span></footer></div>');


  document.getElementById('app').innerHTML = html.join('');

  /* ---------- interaction ---------- */

  function nearest(pts, x) {
    var best = null, bd = Infinity;
    pts.forEach(function (p) { if (p.y != null && Math.abs(p.x - x) < bd) { bd = Math.abs(p.x - x); best = p; } });
    return best;
  }
  function anomalyNote(m, s, day) {
    var hit = m.anoms.filter(function (a) { return a.s === s && dayN(a.ts) === day && a.ak !== 'CPU_SHIFT'; });
    if (!hit.length) return '';
    var z = hit.reduce(function (b, a) { return Math.abs(a.z) > Math.abs(b.z) ? a : b; });
    if (m.fam.id === 'tablespaces') return 'unusual growth ' + sign(z.v) + fBytes(Math.abs(z.v)) + ', usual ' + fBytes(z.e) + ' \u00b7 z ' + num(z.z, 1);
    return 'unusual, usual ' + m.unit.fmt(z.e) + ' \u00b7 z ' + num(z.z, 1);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.chart'), function (el) {
    var spec = CHARTS[+el.getAttribute('data-chart')];
    var svg = el.querySelector('svg'), tip = el.querySelector('.tip');
    var hx = svg.querySelector('.hx'), hd = svg.querySelector('.hd'), hit = svg.querySelector('.hit');
    function hide() { tip.classList.remove('on'); hx.setAttribute('visibility', 'hidden'); hd.setAttribute('visibility', 'hidden'); }
    hit.addEventListener('mouseleave', hide);
    hit.addEventListener('mousemove', function (ev) {
      var r = svg.getBoundingClientRect();
      var vx = (ev.clientX - r.left) / r.width * W;
      var x = spec.x0 + (vx - ML) / (W - ML - MR) * (spec.x1 - spec.x0);
      var lines = [], px, py;
      if (x <= LAST + 0.5) {
        var p = nearest(spec.lines[0].pts, x);
        if (!p) return hide();
        px = spec.xs(p.x); py = spec.ys(p.y);
        lines.push('<b>' + fWDay(p.x) + ' ' + dateOf(p.x).getUTCFullYear() + '</b>');
        spec.lines.forEach(function (l) {
          var q = nearest(l.pts, p.x);
          if (q && q.x === p.x) lines.push((l.label ? esc(l.label) + ' ' : '') + '<b>' + spec.unit.fmt(q.y) + '</b>' + (spec.m.f.lim && l.role === 0 && !spec.pctAxis ? ' \u00b7 ' + num(q.y / (q.lim || spec.m.f.lim) * 100, 1) + '%' : ''));
          if (q && q.x === p.x && (q.a === 1 || q.a === -1)) {
            var note = anomalyNote(spec.m, l.s, q.x);
            lines.push('<span class="a">' + esc(note || 'unusual') + '</span>');
          }
        });
      } else {
        var fc = spec.fc;
        if (fc.length < 2) return hide();
        var i = 1;
        while (i < fc.length - 1 && fc[i].x < x) i++;
        var a = fc[i - 1], b = fc[i], t = Math.max(0, Math.min(1, (x - a.x) / (b.x - a.x)));
        var xd = Math.round(a.x + t * (b.x - a.x));
        t = (xd - a.x) / (b.x - a.x);
        var y = a.y + t * (b.y - a.y);
        var lo = a.lo != null ? a.lo + t * ((b.lo != null ? b.lo : b.y) - a.lo) : (b.lo != null ? a.y + t * (b.lo - a.y) : null);
        var hi = a.hi != null ? a.hi + t * ((b.hi != null ? b.hi : b.y) - a.hi) : (b.hi != null ? a.y + t * (b.hi - a.y) : null);
        px = spec.xs(xd); py = spec.ys(y);
        lines.push('<b>' + fWDay(xd) + ' ' + dateOf(xd).getUTCFullYear() + '</b> \u00b7 +' + (xd - LAST) + ' d');
        lines.push('forecast <b>' + spec.unit.fmt(y) + '</b>');
        if (lo != null && hi != null) lines.push('95% ' + spec.unit.fmt(lo) + ' \u2013 ' + spec.unit.fmt(hi));
      }
      hx.setAttribute('x1', px); hx.setAttribute('x2', px); hx.setAttribute('visibility', 'visible');
      hd.setAttribute('cx', px); hd.setAttribute('cy', py); hd.setAttribute('visibility', 'visible');
      tip.innerHTML = lines.join('<br>');
      tip.style.left = Math.max(70, Math.min(r.width - 70, px / W * r.width)) + 'px';
      tip.style.top = (py / H * r.height) + 'px';
      tip.classList.add('on');
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.mchart'), function (el) {
    var spec = MCHARTS[+el.getAttribute('data-mchart')];
    var svg = el.querySelector('svg'), tip = el.querySelector('.tip');
    var hx = svg.querySelector('.hx'), hit = svg.querySelector('.hit');
    function hide() { tip.classList.remove('on'); hx.setAttribute('visibility', 'hidden'); }
    hit.addEventListener('mouseleave', hide);
    hit.addEventListener('mousemove', function (ev) {
      var r = svg.getBoundingClientRect();
      var x = spec.x0 + ((ev.clientX - r.left) / r.width * MW - MML) / (MW - MML - MMR) * (spec.x1 - spec.x0);
      var d = spec.st.days.reduce(function (b, k) { return Math.abs(k - x) < Math.abs(b - x) ? k : b; });
      var lines = ['<b>' + fWDay(d) + ' ' + dateOf(d).getUTCFullYear() + '</b>'], tot = 0;
      spec.st.comps.slice().reverse().forEach(function (c) {
        var p = c.byX[d];
        if (!p) return;
        tot += p.b;
        lines.push(esc(c.c) + ' <b>' + memSize(p.b) + '</b>' + (memMoved(c, d) ? ' <span class="m">' + memRange(p.lo, p.hi) + ' \u00b7 ' + p.ops + ' op' + (p.ops === 1 ? '' : 's') + '</span>' : ''));
      });
      lines.push('total <b>' + memSize(tot) + '</b>');
      var px = spec.xs(d);
      hx.setAttribute('x1', px); hx.setAttribute('x2', px); hx.setAttribute('visibility', 'visible');
      tip.innerHTML = lines.join('<br>');
      tip.style.left = Math.max(90, Math.min(r.width - 90, px / MW * r.width)) + 'px';
      tip.style.top = (MMT / MH * r.height) + 'px';
      tip.classList.add('on');
    });
  });

  /* Print the memory evidence open, then close what the reader had closed. */
  if (window.addEventListener) {
    var closed = [];
    window.addEventListener('beforeprint', function () {
      closed = Array.prototype.filter.call(document.querySelectorAll('details.mev'), function (el) { return !el.open; });
      closed.forEach(function (el) { el.open = true; });
    });
    window.addEventListener('afterprint', function () { closed.forEach(function (el) { el.open = false; }); });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.heat'), function (el) {
    var tip = document.createElement('div');
    tip.className = 'tip';
    el.style.position = 'relative';
    el.appendChild(tip);
    el.addEventListener('mousemove', function (ev) {
      var c = ev.target;
      if (!c.classList || !c.classList.contains('hc')) { tip.classList.remove('on'); return; }
      var r = el.getBoundingClientRect(), cr = c.getBoundingClientRect();
      var v = c.getAttribute('data-v'), f = +c.getAttribute('data-f'), h = +c.getAttribute('data-h');
      tip.innerHTML = '<b>' + fWDay(+c.getAttribute('data-d')) + ' ' + (h < 10 ? '0' : '') + h + ':00</b> ' + (v === '' ? 'no data' : num(+v, 1) + '%') +
        (f === 1 ? '<br><span class="a">busier than this hour usually is</span>' : f === -1 ? '<br><span class="a">quieter than this hour usually is</span>' : '');
      tip.style.left = (cr.left - r.left + cr.width / 2) + 'px';
      tip.style.top = (cr.top - r.top) + 'px';
      tip.classList.add('on');
    });
    el.addEventListener('mouseleave', function () { tip.classList.remove('on'); });
  });

  var root = document.documentElement, TK = 'cap-theme';
  try { var saved = localStorage.getItem(TK); if (saved) root.setAttribute('data-theme', saved); } catch (e) { /* storage blocked */ }
  document.getElementById('themeBtn').onclick = function () {
    var cur = root.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(TK, next); } catch (e) { /* storage blocked */ }
  };

  if ('IntersectionObserver' in window) {
    var links = {};
    Array.prototype.forEach.call(document.querySelectorAll('.nav a'), function (a) { links[a.getAttribute('href').slice(1)] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && links[e.target.id]) {
          Object.keys(links).forEach(function (k) { links[k].classList.toggle('on', k === e.target.id); });
        }
      });
    }, { rootMargin: '-60px 0px -70% 0px' });
    Array.prototype.forEach.call(document.querySelectorAll('main section'), function (s) { io.observe(s); });
  }
})();
</script>
</body>
</html>
