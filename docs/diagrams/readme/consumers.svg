<svg xmlns="http://www.w3.org/2000/svg" width="640" height="243" class="dg" viewBox="0 0 640 243" role="img" aria-label="Every consumer reads the CAPR_ views: the four SQL*Plus reports, ORDS for Grafana, the ELK export and the APEX app.">
<style>
.dg{--bg:#ffffff;--surface:#f8f9fb;--surface-2:#f1f3f6;--surface-3:#e8ebf0;--text:#111827;--muted:#4b5563;--faint:#8a93a1;--border:#e3e6eb;--border-strong:#cfd4dc;--accent:#2f5bea;--accent-soft:#eaf0ff;--accent-text:#2249c4;--ok:#1f7a4d;--warn:#9a6700;--crit:#c0392b;--ok-bg:#e6f4ec;--warn-bg:#fff5da;--crit-bg:#fdecea;--code-bg:#0f172a;--code-bar:#162036;--code-fg:#d6deea;--code-border:#1f2b45;--mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;--r:10px}
.dg .g{stroke:var(--border);stroke-width:1}
.dg .ax{stroke:var(--border-strong);stroke-width:1;fill:none}
.dg .ln{fill:none;stroke:var(--text);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.dg .fc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:6 4;stroke-linecap:round}
.dg .alt{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:3 3}
.dg .band{fill:var(--accent);opacity:.14;stroke:none}
.dg .zone{fill:var(--surface);stroke:var(--border)}
.dg .soft{fill:var(--accent-soft);stroke:none}
.dg .ceil{fill:none;stroke:var(--crit);stroke-width:1.3;stroke-dasharray:5 4}
.dg .pt{fill:var(--text)}
.dg .pa{fill:var(--accent)}
.dg .bad{fill:none;stroke:var(--crit);stroke-width:1.8}
.dg .badf{fill:var(--crit)}
.dg .okf{fill:var(--ok)}
.dg .box{fill:var(--surface);stroke:var(--border-strong);stroke-width:1}
.dg .boxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.dg .edge{fill:none;stroke:var(--faint);stroke-width:1.2}
.dg .head{fill:var(--faint)}
.dg text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.dg .t{fill:var(--text)}
.dg .tm{font-family:var(--mono);font-size:11px;fill:var(--text)}
.dg .ta{fill:var(--accent-text);font-weight:600}
.dg .tc{fill:var(--crit);font-weight:600}
.dg .ts{font-size:10px;fill:var(--faint)}
@media (prefers-color-scheme:dark){
.dg{--bg:#0c1017;--surface:#121722;--surface-2:#171d29;--surface-3:#1f2634;--text:#e6e9ef;--muted:#a3acbb;--faint:#6b7585;--border:#222a38;--border-strong:#303a4b;--accent:#6f8dff;--accent-soft:#182142;--accent-text:#8ea4ff;--ok:#5cc58c;--warn:#e0b34a;--crit:#f07d74;--ok-bg:#12271c;--warn-bg:#2a2410;--crit-bg:#2e1715;--code-bg:#0a0e16;--code-bar:#10151f;--code-fg:#d6deea;--code-border:#1c2431}
}
</style>
<rect x="0" y="0" width="640" height="243" style="fill:var(--bg)"/>
<defs><marker id="a-int" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="boxa" x="20" y="97" width="140" height="46" rx="5"/><text class="tm" x="90" y="117" text-anchor="middle">CAPR_ views</text><text class="ta" x="90" y="133" text-anchor="middle">CAPR_ALERTS …</text><path class="edge" d="M160 120 C 210 120 210 21 258 21" marker-end="url(#a-int)"/><rect class="box" x="262" y="8" width="190" height="26" rx="4"/><text class="t" x="274" y="25">report.sql (text)</text><path class="edge" d="M160 120 C 210 120 210 54 258 54" marker-end="url(#a-int)"/><rect class="box" x="262" y="41" width="190" height="26" rx="4"/><text class="t" x="274" y="58">report_html.sql</text><path class="edge" d="M160 120 C 210 120 210 87 258 87" marker-end="url(#a-int)"/><rect class="box" x="262" y="74" width="190" height="26" rx="4"/><text class="t" x="274" y="91">report_brief.sql</text><path class="edge" d="M160 120 C 210 120 210 120 258 120" marker-end="url(#a-int)"/><rect class="box" x="262" y="107" width="190" height="26" rx="4"/><text class="t" x="274" y="124">report_csv.sql</text><path class="edge" d="M160 120 C 210 120 210 153 258 153" marker-end="url(#a-int)"/><rect class="box" x="262" y="140" width="190" height="26" rx="4"/><text class="t" x="274" y="157">ORDS → Grafana</text><path class="edge" d="M160 120 C 210 120 210 186 258 186" marker-end="url(#a-int)"/><rect class="box" x="262" y="173" width="190" height="26" rx="4"/><text class="t" x="274" y="190">ELK export → Kibana</text><path class="edge" d="M160 120 C 210 120 210 219 258 219" marker-end="url(#a-int)"/><rect class="box" x="262" y="206" width="190" height="26" rx="4"/><text class="t" x="274" y="223">APEX app</text><text class="ts" x="470" y="117">all read the same rows;</text><text class="ts" x="470" y="131">formatting only</text>
</svg>
