<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" class="archflow" viewBox="0 0 860 240" role="img" aria-label="Architecture: local AWR, AWR copied from target databases or test fixtures feed the CAPV seam, then CAPD daily rollups split into CAPF forecasts and CAPA anomalies, which merge into the CAPR report views.">
<style>
.archflow{--bg:#ffffff;--surface:#f8f9fb;--surface-2:#f1f3f6;--surface-3:#e8ebf0;--text:#111827;--muted:#4b5563;--faint:#8a93a1;--border:#e3e6eb;--border-strong:#cfd4dc;--accent:#2f5bea;--accent-soft:#eaf0ff;--accent-text:#2249c4;--ok:#1f7a4d;--warn:#9a6700;--crit:#c0392b;--ok-bg:#e6f4ec;--warn-bg:#fff5da;--crit-bg:#fdecea;--code-bg:#0f172a;--code-bar:#162036;--code-fg:#d6deea;--code-border:#1f2b45;--mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;--r:10px}
.archflow .af-src{fill:none;stroke:var(--border-strong);stroke-dasharray:4 3}
.archflow .af-box{fill:var(--surface);stroke:var(--border)}
.archflow .af-seam{fill:var(--accent-soft);stroke:none}
.archflow .af-out{fill:var(--accent);stroke:none}
.archflow .af-edge{fill:none;stroke:var(--faint)}
.archflow .af-head{fill:var(--faint)}
.archflow .af-name{font-family:var(--mono);font-size:13px;fill:var(--text)}
.archflow .af-cap{font-family:var(--sans);font-size:10.5px;fill:var(--muted)}
.archflow .af-seam-name{font-family:var(--mono);font-size:13px;fill:var(--accent-text)}
.archflow .af-seam-cap{font-family:var(--sans);font-size:10.5px;fill:var(--accent-text)}
.archflow .af-out-name{font-family:var(--mono);font-size:13px;fill:#ffffff}
.archflow .af-out-cap{font-family:var(--sans);font-size:10.5px;fill:#dfe7ff}
@media (prefers-color-scheme:dark){
.archflow{--bg:#0c1017;--surface:#121722;--surface-2:#171d29;--surface-3:#1f2634;--text:#e6e9ef;--muted:#a3acbb;--faint:#6b7585;--border:#222a38;--border-strong:#303a4b;--accent:#6f8dff;--accent-soft:#182142;--accent-text:#8ea4ff;--ok:#5cc58c;--warn:#e0b34a;--crit:#f07d74;--ok-bg:#12271c;--warn-bg:#2a2410;--crit-bg:#2e1715;--code-bg:#0a0e16;--code-bar:#10151f;--code-fg:#d6deea;--code-border:#1c2431}
.archflow .af-out-name,.archflow .af-out-cap{fill:#0c1017}
}
</style>
<rect x="0" y="0" width="860" height="240" style="fill:var(--bg)"/>
<defs>
          <marker id="af-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path class="af-head" d="M0 0L10 5L0 10z"/>
          </marker>
        </defs>
        <rect class="af-src" x="10" y="20" width="150" height="40" rx="6"/>
        <text class="af-name" x="85" y="38" text-anchor="middle">DBA_HIST_*</text>
        <text class="af-cap" x="85" y="53" text-anchor="middle">local AWR</text>
        <rect class="af-src" x="10" y="100" width="150" height="40" rx="6"/>
        <text class="af-name" x="85" y="118" text-anchor="middle">CAP_H_*</text>
        <text class="af-cap" x="85" y="133" text-anchor="middle">copied from targets</text>
        <rect class="af-src" x="10" y="180" width="150" height="40" rx="6"/>
        <text class="af-name" x="85" y="198" text-anchor="middle">FIX_*</text>
        <text class="af-cap" x="85" y="213" text-anchor="middle">test fixtures</text>
        <path class="af-edge" d="M160 40 C 200 40 200 105 235 112" marker-end="url(#af-arr)"/>
        <path class="af-edge" d="M160 120 L 235 120" marker-end="url(#af-arr)"/>
        <path class="af-edge" d="M160 200 C 200 200 200 135 235 128" marker-end="url(#af-arr)"/>
        <rect class="af-seam" x="240" y="95" width="110" height="50" rx="6"/>
        <text class="af-seam-name" x="295" y="116" text-anchor="middle">CAPV_</text>
        <text class="af-seam-cap" x="295" y="132" text-anchor="middle">the seam</text>
        <path class="af-edge" d="M350 120 L 395 120" marker-end="url(#af-arr)"/>
        <rect class="af-box" x="400" y="95" width="110" height="50" rx="6"/>
        <text class="af-name" x="455" y="116" text-anchor="middle">CAPD_</text>
        <text class="af-cap" x="455" y="132" text-anchor="middle">daily rollups</text>
        <path class="af-edge" d="M510 110 C 545 105 545 65 575 62" marker-end="url(#af-arr)"/>
        <path class="af-edge" d="M510 130 C 545 135 545 175 575 178" marker-end="url(#af-arr)"/>
        <rect class="af-box" x="580" y="38" width="110" height="50" rx="6"/>
        <text class="af-name" x="635" y="59" text-anchor="middle">CAPF_</text>
        <text class="af-cap" x="635" y="75" text-anchor="middle">forecasts</text>
        <rect class="af-box" x="580" y="154" width="110" height="50" rx="6"/>
        <text class="af-name" x="635" y="175" text-anchor="middle">CAPA_</text>
        <text class="af-cap" x="635" y="191" text-anchor="middle">anomalies</text>
        <path class="af-edge" d="M690 63 C 720 65 720 105 745 112" marker-end="url(#af-arr)"/>
        <path class="af-edge" d="M690 179 C 720 177 720 137 745 128" marker-end="url(#af-arr)"/>
        <rect class="af-out" x="750" y="95" width="100" height="50" rx="6"/>
        <text class="af-out-name" x="800" y="116" text-anchor="middle">CAPR_</text>
        <text class="af-out-cap" x="800" y="132" text-anchor="middle">the report</text>
      </svg>
