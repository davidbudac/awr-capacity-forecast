<svg xmlns="http://www.w3.org/2000/svg" width="860" height="252" class="herochart" viewBox="0 0 860 252" role="img" aria-label="One tablespace over time. AWR history runs from 90 days ago to today, with one day flagged for growing 5.8 sigma more than a typical day. From today a dashed forecast line and a 95% band project forward, crossing the tablespace ceiling between 57 and 77 days out.">
<style>
.herochart{--bg:#ffffff;--surface:#f8f9fb;--surface-2:#f1f3f6;--surface-3:#e8ebf0;--text:#111827;--muted:#4b5563;--faint:#8a93a1;--border:#e3e6eb;--border-strong:#cfd4dc;--accent:#2f5bea;--accent-soft:#eaf0ff;--accent-text:#2249c4;--ok:#1f7a4d;--warn:#9a6700;--crit:#c0392b;--ok-bg:#e6f4ec;--warn-bg:#fff5da;--crit-bg:#fdecea;--code-bg:#0f172a;--code-bar:#162036;--code-fg:#d6deea;--code-border:#1f2b45;--mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;--r:10px}
.herochart .hc-grid{stroke:var(--border);stroke-width:1}
.herochart .hc-axis{stroke:var(--border-strong);stroke-width:1;fill:none}
.herochart .hc-div{stroke:var(--border-strong);stroke-dasharray:3 3}
.herochart .hc-hist{fill:none;stroke:var(--text);stroke-width:1.8; stroke-linejoin:round;stroke-linecap:round}
.herochart .hc-fc{fill:none;stroke:var(--accent);stroke-width:1.8; stroke-dasharray:5 4;stroke-linecap:round}
.herochart .hc-band{fill:var(--accent);opacity:.13;stroke:none}
.herochart .hc-ceil{fill:none;stroke:var(--crit);stroke-width:1.3;stroke-dasharray:5 4}
.herochart .hc-mark{fill:none;stroke:var(--crit);stroke-width:1.8}
.herochart .hc-dot{fill:var(--accent)}
.herochart .hc-span{stroke:var(--accent);stroke-width:2}
.herochart .hc-lbl{font-family:var(--sans);font-size:10px;fill:var(--faint); letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.herochart .hc-cap{font-family:var(--sans);font-size:10.5px;fill:var(--muted)}
.herochart .hc-crit{font-family:var(--sans);font-size:10.5px;fill:var(--crit);font-weight:600}
.herochart .hc-acc{font-family:var(--sans);font-size:10.5px;fill:var(--accent-text);font-weight:600}
.herochart .hc-src{font-family:var(--mono);font-size:10px;fill:var(--faint)}
@media (prefers-color-scheme:dark){
.herochart{--bg:#0c1017;--surface:#121722;--surface-2:#171d29;--surface-3:#1f2634;--text:#e6e9ef;--muted:#a3acbb;--faint:#6b7585;--border:#222a38;--border-strong:#303a4b;--accent:#6f8dff;--accent-soft:#182142;--accent-text:#8ea4ff;--ok:#5cc58c;--warn:#e0b34a;--crit:#f07d74;--ok-bg:#12271c;--warn-bg:#2a2410;--crit-bg:#2e1715;--code-bg:#0a0e16;--code-bar:#10151f;--code-fg:#d6deea;--code-border:#1c2431}
}
</style>
<rect x="0" y="0" width="860" height="252" style="fill:var(--bg)"/>
<text class="hc-lbl" x="60" y="22">AWR history</text>
          <text class="hc-lbl" x="438" y="22">forecast · 95% band</text>

          <line class="hc-grid" x1="60" y1="160" x2="820" y2="160"/>
          <line class="hc-grid" x1="60" y1="115" x2="820" y2="115"/>
          <line class="hc-grid" x1="60" y1="70"  x2="820" y2="70"/>

          <line class="hc-ceil" x1="60" y1="52" x2="820" y2="52"/>
          <text class="hc-crit" x="64" y="45">tablespace ceiling</text>

          <path class="hc-band" d="M430 112 L800 18 L800 66 Z"/>
          <path class="hc-hist" d="M60 182 L80 179 L100 177 L120 174 L140 172 L160 169 L180 167
            L200 164 L220 162 L240 159 L250 131 L260 129 L280 127 L300 125 L320 122 L340 120
            L360 118 L380 116 L400 114 L420 113 L430 112"/>

          <circle class="hc-mark" cx="250" cy="131" r="6.5"/>
          <text class="hc-crit" x="250" y="112" text-anchor="middle">that day grew 5.8σ over the median day</text>

          <path class="hc-fc" d="M430 112 L800 42"/>
          <line class="hc-div" x1="430" y1="30" x2="430" y2="200"/>

          <circle class="hc-dot" cx="666" cy="52" r="3.5"/>
          <circle class="hc-dot" cx="747" cy="52" r="3.5"/>
          <line class="hc-span" x1="666" y1="52" x2="747" y2="52"/>
          <text class="hc-acc" x="706" y="42" text-anchor="middle">days to full · 57–77</text>

          <line class="hc-axis" x1="60" y1="200" x2="820" y2="200"/>
          <g class="hc-axis">
            <line x1="60" y1="200" x2="60" y2="205"/>
            <line x1="245" y1="200" x2="245" y2="205"/>
            <line x1="430" y1="200" x2="430" y2="207"/>
            <line x1="615" y1="200" x2="615" y2="205"/>
            <line x1="800" y1="200" x2="800" y2="205"/>
          </g>
          <text class="hc-cap" x="60"  y="221" text-anchor="middle">&#8722;90 d</text>
          <text class="hc-cap" x="245" y="221" text-anchor="middle">&#8722;45 d</text>
          <text class="hc-acc" x="430" y="221" text-anchor="middle">today</text>
          <text class="hc-cap" x="615" y="221" text-anchor="middle">+45 d</text>
          <text class="hc-cap" x="800" y="221" text-anchor="middle">+90 d</text>
          <text class="hc-src" x="60" y="244">DBA_HIST_TBSPC_SPACE_USAGE &#8594; CAPD_ &#8594; CAPF_ / CAPA_</text>
        </svg>
